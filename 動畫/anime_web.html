function renderCard(e) {
  if (isNews(e)) return renderNewsCard(e);
  const cardClass = getCardClass(e);
  const pct = e.progress_pct;
  const status = getStatus(e);

  // ── Cover image
  let coverHtml;
  if (e.image_url) {
    coverHtml = `<div class="card-cover">
      <img data-src="${escHtml(e.image_url)}" alt="" loading="lazy">
    </div>`;
  } else {
    const initial = (e.title || '?')[0];
    coverHtml = `<div class="card-cover">
      <div class="cover-placeholder">${escHtml(initial)}</div>
    </div>`;
  }

  // ── Category tags (all)
  const catTagHtml = renderCatTags(e);

  // ── Status tags
  let tags = '';
  if (e.type === 'movie') tags += `<span class="tag tag-movie">劇場版</span>`;
  if (e.season) tags += `<span class="tag tag-season">${seasonEmoji(e.season)} ${e.season}</span>`;
  if (status === 'complete') tags += `<span class="tag tag-complete">完結</span>`;
  if (status === 'partial') tags += `<span class="tag tag-partial">進行中</span>`;


  // ── Meta row: studio · episodes
  const metaParts = [];
  if (e.studios && e.studios.length) metaParts.push(escHtml(e.studios[0]));
  if (e.episodes) metaParts.push(`${e.episodes}集`);
  const metaHtml = metaParts.length
    ? `<div class="card-meta-row">${metaParts.join('<span class="dot"> · </span>')}</div>`
    : '';

  // ── Scores
  const sid = 'scores-' + escHtml(e.title).replace(/['"<>&]/g,'_');
  const scoresHtml = `<div class="card-scores" id="${sid}">${renderCardScores(e)}</div>`;

  // ── Shared title escape
  const tq  = escHtml(e.title).replace(/'/g, "\\'");

  // ── Progress bar
  const pid = 'prog-' + escHtml(e.title).replace(/['"<>&]/g, '_');
  const progressHtml = `<div class="progress-wrap" id="${pid}" onclick="event.stopPropagation()" ondblclick="startEditProgress(event,'${tq}')">${renderCardProgressInner(e)}</div>`;

  // ── Comment, info & synopsis
  const cid = 'comment-' + escHtml(e.title).replace(/['"<>&]/g, '_');
  const commentHtml = `<div class="card-comment" id="${cid}" onclick="event.stopPropagation()" ondblclick="startEditComment(event,'${tq}')">${e.comment ? escHtml(e.comment) : '<span class="comment-placeholder">雙擊新增評論…</span>'}</div>`;
  const infoHtml = e.info
    ? `<div class="card-info"><span class="card-info-label">資訊</span>${escHtml(e.info)}</div>` : '';
  const synopsisHtml = e.synopsis
    ? `<div class="card-synopsis">${escHtml(e.synopsis)}</div>` : '';

  const heartId = 'heart-' + escHtml(e.title).replace(/['"<>&]/g,'_');
  const heartHtml = `<button class="heart-btn${e.want_to_watch ? ' active' : ''}" id="${heartId}" onclick="toggleWantToWatch(event,'${tq}')" title="想看">${e.want_to_watch ? '💛' : '🤍'}</button>`;

  const dragAttrs = state.reorderMode
    ? ` draggable="true" ondragstart="_cardDragStart(event,this)" ondragover="_cardDragOver(event,this)" ondrop="_cardDrop(event)" ondragend="_cardDragEnd(event,this)"`
    : '';

  return `<div class="card ${cardClass}${e.want_to_watch ? ' want-to-watch' : ''}${e.title === _flashTitle ? ' flash-target' : ''}" data-title="${escHtml(e.title)}"${dragAttrs} onclick="openDetailModal('${tq}')">
    <div class="card-top">
      ${coverHtml}
      <div class="card-body">
        <div class="card-title-row">
          <div class="card-title" ondblclick="startEditTitle(this,'${escHtml(e.title).replace(/'/g,"&#39;")}')">${escHtml(e.title)}</div>
          ${heartHtml}
          <button class="del-btn" onclick="confirmDelete('${escHtml(e.title).replace(/'/g,"&#39;")}')">🗑</button>
        </div>
        ${(e.aliases && e.aliases.length) ? `<div class="card-alias">${e.aliases.map(a => escHtml(a)).join(' · ')}</div>` : ''}
        <div class="card-tags" id="tags-${escHtml(e.title).replace(/['"<>&]/g,'_')}">
          ${catTagHtml}
          ${renderUserTags(e)}
        </div>
        ${metaHtml}
        ${scoresHtml}
      </div>
    </div>
    <div class="card-bottom">
      ${progressHtml}
      ${commentHtml}
      ${infoHtml}
      ${synopsisHtml}
    </div>
  </div>`;
}

// ─── Lazy load images ─────────────────────────────────────────────────────────
function initLazyLoad() {
  const imgs = document.querySelectorAll('img[data-src]');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          const img = en.target;
          img.src = img.dataset.src;
          img.removeAttribute('data-src');
          img.onload = () => img.classList.add('loaded');
          img.onerror = () => {
            img.parentElement.innerHTML = `<div class="cover-placeholder">${img.alt || '?'}</div>`;
          };
          obs.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });
    imgs.forEach(img => obs.observe(img));
  } else {
    imgs.forEach(img => { img.src = img.dataset.src; img.classList.add('loaded'); });
  }
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _dmEsc(s) {
  return escHtml(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ─── Render Content ───────────────────────────────────────────────────────────
function applyFilters() {
  state.search = document.getElementById('search-box').value;
  const filtered = filterData();
  renderContent(filtered);
}

function renderContent(filtered) {
  const content = document.getElementById('content');
  const sidebar = document.getElementById('sidebar');
  const emptyEl = document.getElementById('empty-state');
  const countEl = document.getElementById('result-count');

  const poolTotal = state.newsMode ? data.filter(isNews).length : data.filter(e => !isNews(e)).length;
  countEl.textContent = `顯示 ${filtered.length} / ${poolTotal} 部`;

  if (filtered.length === 0) {
    content.innerHTML = `<div id="empty-state" style="display:block;text-align:center;padding:80px 20px;color:var(--text3)">
      <div style="font-size:48px;margin-bottom:12px">🔍</div>
      <p>找不到符合條件的動畫</p></div>`;
    sidebar.innerHTML = '';
    return;
  }

  // 預告／未定檔：獨立釘選在最上方，不參與年份分組
  const upcoming = sortByManualOrder(filtered.filter(e => e.upcoming));
  const rest = filtered.filter(e => !e.upcoming);
  const gridClass = state.reorderMode ? 'cards-grid reorder-active' : 'cards-grid';

  // Group by year → season
  const byYear = {};
  for (const e of rest) {
    const y = e.year || '未知';
    if (!byYear[y]) byYear[y] = {};
    const s = e.season || (e.type === 'movie' ? '劇場版' : '未知');
    if (!byYear[y][s]) byYear[y][s] = [];
    byYear[y][s].push(e);
  }

  const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
  const seasonOrder = ['秋', '夏', '春', '冬', '劇場版', '未知'];

  // Sidebar
  let sidebarHtml = '';
  if (upcoming.length) {
    sidebarHtml += `<button class="year-btn upcoming-btn${state.activeYear === 'upcoming' ? ' active' : ''}" onclick="scrollToYear('upcoming')" id="ybtn-upcoming">
      <span class="ynum">🔜 預告</span><span class="ycnt">${upcoming.length}部</span>
    </button>`;
  }
  sidebarHtml += years.map(y => {
    const total = Object.values(byYear[y]).flat().length;
    return `<button class="year-btn${y == state.activeYear ? ' active' : ''}" onclick="scrollToYear(${y})" id="ybtn-${y}">
      <span class="ynum">${y}</span><span class="ycnt">${total}部</span>
    </button>`;
  }).join('');
  sidebar.innerHTML = sidebarHtml;

  // Content
  let html = '';
  if (upcoming.length) {
    html += `<div class="year-section" id="year-upcoming" data-year="upcoming">
      <div class="year-header">
        <span class="year-label">🔜 預告／未定檔</span>
        <div class="year-line"></div>
        <span class="year-total">${upcoming.length} 部</span>
      </div>
      <div class="season-group">
        <div class="${gridClass}">${upcoming.map(renderCard).join('')}</div>
      </div>
    </div>`;
  }
  for (const y of years) {
    const total = Object.values(byYear[y]).flat().length;
    html += `<div class="year-section" id="year-${y}" data-year="${y}">
      <div class="year-header">
        <span class="year-label">${y}</span>
        <div class="year-line"></div>
        <span class="year-total">${total} 部</span>
      </div>`;

    const seasons = Object.keys(byYear[y]).sort((a,b) => {
      const ia = seasonOrder.indexOf(a);
      const ib = seasonOrder.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    for (const s of seasons) {
      const items = sortByManualOrder(byYear[y][s]);
      html += `<div class="season-group">
        <div class="season-label">${y + ' ' + (s === '劇場版' ? '🎬 劇場版' : seasonEmoji(s) + ' ' + s + '季' + `<span class="season-range">(${seasonMonthRange(s)})</span>`)}</div>
        <div class="${gridClass}">${items.map(renderCard).join('')}</div>
      </div>`;
    }
    html += '</div>';
  }
  content.innerHTML = html;
  initLazyLoad();

  // Update active year on scroll
  trackScroll();
}

// ─── Sidebar year scroll tracking ────────────────────────────────────────────
let scrollTimer = null;
function trackScroll() {
  const content = document.getElementById('content');
  content.onscroll = () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const sections = content.querySelectorAll('.year-section');
      let activeY = null;
      for (const sec of sections) {
        const rect = sec.getBoundingClientRect();
        if (rect.top <= content.getBoundingClientRect().top + 60) {
          activeY = sec.dataset.year;
        }
      }
      if (activeY && activeY !== state.activeYear) {
        state.activeYear = activeY;
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`ybtn-${activeY}`);
        if (btn) {
          btn.classList.add('active');
          btn.scrollIntoView({ block: 'nearest' });
        }
      }
    }, 80);
  };
}

function scrollToYear(y) {
  const el = document.getElementById('year-' + y);
  if (!el) return;
  // scrollIntoView (unlike manual getBoundingClientRect math) correctly forces browsers to
  // reveal content-visibility:auto sections that haven't been measured yet, so the target
  // lands accurately even when jumping straight to a year that's never been scrolled near.
  el.scrollIntoView({ block: 'start' });
}

// 網頁最後更新時間：純粹是使用者自己手動維護的日期（見 ../last_updated.json），
// 不是自動算出來的檔案修改時間，動畫/漫畫/遊戲三頁共用同一個檔案、顯示同一個日期
// 網頁最後更新時間：動畫/漫畫/遊戲三頁各自獨立的一個日期值（各自的 last_updated.json，
// 不是共用同一個檔案），可以直接在頁面上雙擊編輯，儲存只會動到這一頁自己的檔案，

let _lastUpdatedDate = null;

async function loadLastUpdated() {
  try {
    const res = await fetch('last_updated.json');
    if (!res.ok) return;
    const j = await res.json();
    _lastUpdatedDate = j.date;
    renderLastUpdated();
  } catch {
    // 檔案還沒建立時安靜略過
  }
}

function renderLastUpdated() {
  const span = document.getElementById('last-updated');
  if (!_lastUpdatedDate) { span.textContent = ''; return; }
  const [y, m, d] = _lastUpdatedDate.split('-');
  span.textContent = `最後更新：${y}年${Number(m)}月${Number(d)}日`;
}

function startEditLastUpdated() {
  const span = document.getElementById('last-updated');
  span.innerHTML = `<input type="date" id="last-updated-input" value="${_lastUpdatedDate || ''}">`;
  const input = document.getElementById('last-updated-input');
  input.focus();
  input.onblur = saveLastUpdated;
  input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
}

async function saveLastUpdated() {
  const input = document.getElementById('last-updated-input');
  const date = input.value;
  if (!date) { renderLastUpdated(); return; }
  try {
    const res = await fetch('http://localhost:3737/api/save-last-updated', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ page: 'anime', date })
    });
    const j = await res.json();
    if (j.ok) _lastUpdatedDate = j.date;
  } catch {
    alert('無法連線到伺服器，請確認 server.py 已啟動。');
  }
  renderLastUpdated();
}

// ─── Server Status Indicator ──────────────────────────────────────────────────
function setStatusText(el, text) {
  // 只改第一個文字節點，保留 countdown span
  const node = [...el.childNodes].find(n => n.nodeType === 3);
  if (node) node.textContent = text;
  else el.insertBefore(document.createTextNode(text), el.firstChild);
}

async function checkServer() {
  const el = document.getElementById('server-status');
  try {
    const res = await fetch('http://localhost:3737/api/status', { cache: 'no-store' });
    const j = await res.json();
    if (j.count > 1) {
      el.className = 'multi';
      setStatusText(el, `⬤ 伺服器 ×${j.count}（建議重開）`);
      el.title = `目前有 ${j.count} 個 server.py 在執行，可能有衝突。\n請關閉後重新執行開啟動畫紀錄.bat`;
    } else {
      el.className = '';
      setStatusText(el, `⬤ 伺服器運作中 (PID ${j.pid})`);
      el.title = `連線正常 · PID ${j.pid}`;
    }
  } catch {
    el.className = 'offline';
    setStatusText(el, '⬤ 伺服器未連線');
    el.title = '無法連線到 localhost:3737，請執行開啟動畫紀錄.bat';
  }
}
let _countdown = 15;
let _countdownEl = null;

function startCountdown() {
  _countdown = 15;
  if (!_countdownEl) return;
  _countdownEl.textContent = ` ${_countdown}s`;
  clearInterval(_countdownEl._timer);
  _countdownEl._timer = setInterval(() => {
    _countdown--;
    if (_countdown <= 0) {
      clearInterval(_countdownEl._timer);
    } else {
      _countdownEl.textContent = ` ${_countdown}s`;
    }
  }, 1000);
}

checkServer().then(() => {
  _countdownEl = document.getElementById('server-countdown');
  startCountdown();
});

setInterval(() => {
  checkServer().then(() => startCountdown());
}, 15000);

});

function _dmRender(e, keepTab) {
  // Cover
  const coverEl = document.getElementById('detail-cover');
  if (e.image_url) {
    coverEl.innerHTML = `<img src="${escHtml(e.image_url)}" alt="" loading="lazy">`;
  } else {
    const ch = escHtml((e.title || '?').replace(/^劇場版\s*/,'')[0] || '?');
    coverEl.innerHTML = `<div class="dm-placeholder">${ch}</div>`;
  }

  // Title & subtitle
  const parts = [];
  if (e.year)   parts.push(e.year + '年');
  if (e.season) parts.push(e.season);
  if (e.progress_total) parts.push(e.progress_total + '集');
  if (e.studio) parts.push(e.studio);
  document.getElementById('dm-title').textContent    = e.title;
  document.getElementById('dm-subtitle').textContent = parts.join(' · ');
  const aliasEl = document.getElementById('dm-aliases');
  if (e.aliases && e.aliases.length) {
    aliasEl.textContent = e.aliases.join(' · ');
    aliasEl.style.display = '';
  } else {
    aliasEl.style.display = 'none';
  }

  // Tags
  const cats = CATS;
  document.getElementById('dm-tags').innerHTML =
    (e.tags || []).map(t => {
      const c = cats[t];
      return c ? `<span class="cat-tag" style="--c:${c.color}">${c.label}</span>`
               : '';
    }).join('');

  // Scores
  const bgmHtml = e.bgm_score
    ? `<span class="dm-bgm-score">BGM <strong>${e.bgm_score}</strong></span>`
    : '';
  const myCls = e.score ? scoreClass(e.score) : '';
  const myHtml = e.score
    ? `<span>個人 <strong class="${myCls}">${e.score}</strong></span>`
    : `<span style="color:var(--text3)">個人 —</span>`;
  document.getElementById('dm-scores').innerHTML = bgmHtml +
    `<span id="dm-my-score" class="dm-editable" title="點擊編輯個人評分" onclick="dmStartEditScore('${_dmEsc(e.title)}')">${myHtml}</span>`;

  // Progress (rebuild bar+text from scratch — the edit UI replaces these nodes)
  const pw = e.progress_watched, pt = e.progress_total, pct = e.progress_pct || 0;
  const fillCls = pw === '?' ? 'fill-unknown' : fillClass(pct, pw);
  const barW    = pw === '?' ? 40 : pct;
  const progColor   = pw === '?' ? 'color:var(--accent)' : '';
  const progWrap = document.getElementById('dm-prog-wrap');
  progWrap.innerHTML = `<div id="dm-prog-bar"><div id="dm-prog-fill" class="progress-fill ${fillCls}" style="width:${barW}%"></div></div>` +
    `<span id="dm-prog-text">${(pw !== null && pw !== undefined)
      ? `<span style="${progColor}">${pw}/${pt || '?'}</span>`
      : `<span style="color:var(--text3)">未觀看</span>`}</span>`;
  progWrap.title = '點擊編輯觀看進度';
  progWrap.onclick = () => dmStartEditProgress(e.title);

  // Default tab
  document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
  const _tab = keepTab || 'info';
  document.querySelector(`.dtab[data-tab="${_tab}"]`).classList.add('active');
  _dmLoadTab(_tab);

  // Series
  const related = _dmFindSeries(e);
  const seriesDiv = document.getElementById('detail-series');
  if (related.length > 1) {
    seriesDiv.style.display = '';
    _dmRenderStrip(related, e.title);
  } else {
    seriesDiv.style.display = 'none';
  }
}

function switchDTab(btn) {
  document.querySelectorAll('.dtab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

}

function _dmLoadTab(tab) {
  const e = data.find(x => x.title === _dmTitle);
  if (!e) return;
  const box = document.getElementById('detail-content');

  if (tab === 'comment') {
    const tq = e.title.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const body = e.comment
      ? `<div id="dm-comment-text" style="white-space:pre-wrap">${escHtml(e.comment)}</div>`
      : `<div id="dm-comment-text" class="dm-placeholder">尚未新增評論</div>`;
    box.innerHTML = `${body}<button id="dm-comment-edit-btn" onclick="dmStartEdit('${tq}')">✏ 編輯心得</button>`;
  } else if (tab === 'info') {
    box.innerHTML = e.info
      ? `<div style="white-space:pre-wrap">${escHtml(e.info)}</div>`
      : `<span class="dm-placeholder">（無資訊）</span>`;
  } else if (tab === 'controversy') {
    box.innerHTML = e.controversy
      ? `<div style="white-space:pre-wrap">${escHtml(e.controversy)}</div>`
      : `<span class="dm-placeholder">（無爭議資訊）</span>`;
  } else {
    box.innerHTML = e.synopsis
      ? `<div style="white-space:pre-wrap">${escHtml(e.synopsis)}</div>`
      : `<span class="dm-placeholder">（無簡介）</span>`;
  }
}

function dmStartEdit(title) {
  const e = data.find(x => x.title === title);
  if (!e) return;
  const box = document.getElementById('detail-content');
  box.innerHTML = `
    <textarea id="dm-comment-ta" placeholder="輸入心得評論…">${escHtml(e.comment || '')}</textarea>
    <div class="dm-edit-btns">
      <button class="news-submit" style="padding:4px 14px;font-size:12px" onclick="dmSaveComment('${title.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">儲存</button>
      <button class="del-cancel" style="padding:4px 10px;font-size:12px" onclick="_dmLoadTab('comment')">取消</button>
    </div>`;
  document.getElementById('dm-comment-ta').focus();
}

async function dmSaveComment(title) {
  const ta = document.getElementById('dm-comment-ta');
  if (!ta) return;
  const newComment = ta.value.trim();
  try {
    const res = await fetch('http://localhost:3737/api/save-comment', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ title, comment: newComment })
    });
    if (!res.ok) throw new Error('server');
    const e = data.find(x => x.title === title);
    if (e) {
      e.comment = newComment;
      // sync the list card
      const cid = 'comment-' + escHtml(title).replace(/['"<>&]/g,'_');
      const cardEl = document.getElementById(cid);
      if (cardEl) cardEl.innerHTML = newComment
        ? escHtml(newComment)
        : '<span class="comment-placeholder">雙擊新增評論…</span>';
    }
    _dmLoadTab('comment');
  } catch { alert('無法儲存，請確認伺服器已啟動'); }
}

function _dmActiveTab() {
  const btn = document.querySelector('.dtab.active');
  return btn ? btn.dataset.tab : 'info';
}

// ─── Detail Modal: Score Edit ──────────────────────────────────────────────
function dmStartEditScore(title) {
  const e = data.find(x => x.title === title);
  if (!e) return;
  const wrap = document.getElementById('dm-scores');
  if (wrap.querySelector('.dm-score-input')) return;
  const bgmHtml = e.bgm_score ? `<span class="dm-bgm-score">BGM <strong>${e.bgm_score}</strong></span>` : '';
  const cur = e.score ?? '';
  wrap.innerHTML = `${bgmHtml}<span>個人
    <input id="dm-score-input" class="dm-score-input" type="number" min="0" max="10" step="0.5" value="${cur}" placeholder="0-10">
  </span>`;
  const input = document.getElementById('dm-score-input');
  input.focus(); input.select();

  let saved = false;
  const commit = () => { if (!saved) { saved = true; dmSaveScore(title, input.value); } };
  input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    if (ev.key === 'Escape') { saved = true; _dmRender(e, _dmActiveTab()); }
  });
  input.addEventListener('click', ev => ev.stopPropagation());
  input.addEventListener('blur', () => setTimeout(commit, 120));
}

async function dmSaveScore(title, rawValue) {
  const val = (rawValue ?? '').trim();
  let score = null;
  if (val !== '') {
    const n = Number(val);
    if (isNaN(n) || n < 0 || n > 10) {
      alert('評分請輸入 0 到 10 之間的數字');
      const e0 = data.find(x => x.title === title);
      if (e0) _dmRender(e0, _dmActiveTab());
      return;
    }
    score = n;
  }
  try {
    const res = await fetch('http://localhost:3737/api/save-score', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ title, score })
    });
    if (!res.ok) throw new Error('server');
    const e = data.find(x => x.title === title);
    if (e) e.score = score;
  } catch { alert('無法儲存，請確認伺服器已啟動'); }
  const e = data.find(x => x.title === title);
  if (e) _dmRender(e, _dmActiveTab());
  if (e) rerenderCardScore(e);
}

function dmStartEditProgress(title) {
  const e = data.find(x => x.title === title);
  if (!e) return;
  const wrap = document.getElementById('dm-prog-wrap');
  if (wrap.querySelector('.prog-input')) return;
  wrap.onclick = null;
  const curW = e.progress_watched ?? '';
  const curT = e.progress_total ?? '';

  const inW = document.createElement('input');
  inW.className = 'prog-input'; inW.value = curW; inW.placeholder = '已看';
  const sep = document.createElement('span');
  sep.className = 'prog-sep'; sep.textContent = '/';
  const inT = document.createElement('input');
  inT.className = 'prog-input'; inT.value = curT; inT.placeholder = '總集';
  const doneBtn = document.createElement('button');
  doneBtn.className = 'prog-done-btn'; doneBtn.textContent = '完結';

  wrap.innerHTML = '';
  wrap.append(inW, sep, inT, doneBtn);
  inW.focus(); inW.select();

  let saved = false;
  const commit = () => { if (!saved) { saved = true; dmSaveProgress(title, inW.value, inT.value); } };

  doneBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    const t = inT.value.trim();
    if (t && t !== 'V' && !isNaN(Number(t)) && Number(t) > 0) {
      inW.value = t;
    } else {
      inW.value = 'V'; inT.value = 'V';
    }
    commit();
  });

  inW.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') inT.focus(); });
  inT.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape') { saved = true; _dmRender(e, _dmActiveTab()); }
  });
  [inW, inT].forEach(inp => {
    inp.addEventListener('click', ev => ev.stopPropagation());
    inp.addEventListener('blur', () => setTimeout(() => {
      if (!wrap.contains(document.activeElement)) commit();
    }, 120));
  });
}

async function dmSaveProgress(title, watchedRaw, totalRaw) {
  const watched = (watchedRaw ?? '').trim();
  const total   = (totalRaw ?? '').trim();
  try {
    const res = await fetch('http://localhost:3737/api/save-progress', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ title, watched, total })
    });
    const j = await res.json();
    const e = data.find(x => x.title === title);
    if (e) {
      e.progress_watched = watched || null;
      e.progress_total   = total   || null;
      e.progress_pct     = j.pct ?? null;
    }
  } catch { alert('無法連線到伺服器'); }
  const e = data.find(x => x.title === title);
  if (e) _dmRender(e, _dmActiveTab());
  if (e) rerenderCardProgress(e);
}

function _dmFindSeries(entry) {
  // Map season to representative month for accurate chronological sort
  // 冬=1 (Jan-Mar) < 春=4 (Apr-Jun) < 夏=7 (Jul-Sep) < 秋=10 (Oct-Dec)
  const SEASON_M = { 冬: 1, 春: 4, 夏: 7, 秋: 10, 劇場版: 12, 未知: 0 };
  function toMonth(e) {
    if (e.month) return e.month;
    return SEASON_M[e.season||'未知'] || 0;
  }
  function byDate(a, b) {
    const au = !!a.upcoming, bu = !!b.upcoming;
    if (au !== bu) return au ? 1 : -1; // 預告／未上映一律排最右（最新）
    if ((a.year||0) !== (b.year||0)) return (a.year||0) - (b.year||0);
    return toMonth(a) - toMonth(b);
  }

  // ── Priority 1: pre-computed series_id from Bangumi relations ──
  if (entry.series_id != null) {
    const core = data.filter(x => x.series_id === entry.series_id);
    const coreTitles = new Set(core.map(x => x.title));
    // Also include entries whose aliases explicitly reference a core title
    // (covers entries that weren't linked via Bangumi API but were manually aliased)
    const group = data.filter(x =>
      x.series_id === entry.series_id ||
      (x.aliases || []).some(a => coreTitles.has(a))
    );
    if (group.length > 1) return group.sort(byDate);
  }

  // ── Priority 2: string-based fallback (for entries without bgm_id) ──
  const title   = entry.title;
  const aliases = entry.aliases || [];
  const allTitles = [...new Set(data.map(x => x.title))];
  const allSet    = new Set(allTitles);

  // True series continuation: space/colon separator required for short roots (<8 chars)
  function isCont(base, full) {
    if (!full.startsWith(base) || full.length <= base.length) return false;
    if (base.length >= 8) return true;
    const next = full[base.length];
    return next === ' ' || next === '　' || next === ':' || next === '：';
  }

  const aliasRoot = aliases.find(a => allSet.has(a));
  let aliasPfx = '';
  if (!aliasRoot) {
    for (const a of aliases)
      for (const t of allTitles)
        if (t !== title && isCont(t, a) && t.length > aliasPfx.length) aliasPfx = t;
  }
  let titlePfx = '';
  if (!aliasRoot && !aliasPfx) {
    for (const t of allTitles)
      if (t !== title && isCont(t, title) && t.length > titlePfx.length) titlePfx = t;
  }

  const root = aliasRoot || aliasPfx || titlePfx || title;
  return data.filter(x =>
    x.title === root ||
    isCont(root, x.title) ||
    (x.aliases || []).includes(root) ||
    (x.aliases || []).some(a => a === root || isCont(root, a))
  ).sort(byDate);
}

function _dmRenderStrip(related, currentTitle) {
  const scroll = document.getElementById('dm-series-scroll');
  scroll.innerHTML = related.map(e => {
    const active = e.title === currentTitle ? 'dm-active' : '';
    const tq = e.title.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const coverHtml = e.image_url
      ? `<img src="${escHtml(e.image_url)}" alt="" loading="lazy">`
      : `<div class="dm-placeholder">${escHtml((e.title||'?').replace(/^劇場版\s*/,'')[0]||'?')}</div>`;
    let badge = '';
    if (e.type === 'movie') badge = `<span class="series-thumb-badge movie">劇場版</span>`;
    else if (e.type === 'ova') badge = `<span class="series-thumb-badge ova">OVA</span>`;
    else if (e.type === 'short') badge = `<span class="series-thumb-badge short">短篇</span>`;
    const upcomingBadge = e.upcoming ? `<span class="series-thumb-badge upcoming">未上映</span>` : '';
    return `<div class="series-thumb ${active}" onclick="_dmNavTo('${tq}')">
      <div class="series-thumb-img">${coverHtml}</div>
      ${badge}${upcomingBadge}
      <div class="series-thumb-label">${escHtml(e.title)}</div>
    </div>`;
  }).join('');
  setTimeout(() => {
    const act = scroll.querySelector('.dm-active');
    if (act) act.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 60);
}

function _dmNavTo(title) {
  const e = data.find(x => x.title === title);
  if (!e) return;
  const curTab = document.querySelector('.dtab.active')?.dataset.tab || 'info';
  _dmTitle = title;
  _dmRender(e, curTab);
  _dmScrollCard(title);
}

function _dmScrollCard(title) {
  const els = document.querySelectorAll('.card-title');
  for (const el of els) {
    if (el.textContent.trim() === title) {
      el.closest('.card')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }
  }
  _setFlashTarget(title);
}

// 讓對應卡片的外框持續閃爍，直到使用者真的點開那部動畫（見 openDetailModal 裡的清除邏輯）
function _setFlashTarget(title) {
  if (_flashTitle && _flashTitle !== title) _clearFlashTarget();
  _flashTitle = title;
  const els = document.querySelectorAll('.card-title');
  for (const el of els) {
    if (el.textContent.trim() === title) {
      el.closest('.card')?.classList.add('flash-target');
      break;
    }
  }
}

function _clearFlashTarget() {
  if (!_flashTitle) return;
  const prev = _flashTitle;
  _flashTitle = null;
  const els = document.querySelectorAll('.card-title');
  for (const el of els) {
    if (el.textContent.trim() === prev) {
      el.closest('.card')?.classList.remove('flash-target');
      break;
    }
  }
}
</script>
