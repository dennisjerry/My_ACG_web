<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的漫畫紀錄</title>
<script src="data.js?v=1786967071"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0d0d1a;
  --bg2:      #13132a;
  --bg3:      #1a1a35;
  --bg4:      #22223f;
  --border:   #2a2a50;
  --accent:   #7c3aed;
  --accent2:  #a78bfa;
  --accent3:  #c4b5fd;
  --green:    #10b981;
  --yellow:   #f59e0b;
  --red:      #ef4444;
  --blue:     #60a5fa;
  --text:     #e0e0f0;
  --text2:    #9090b0;
  --text3:    #555570;
  --radius:   8px;
}
html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; font-family: inherit; }

/* ─── Layout（比照主 anime_web.html：#app 撐滿 100vh，只有 #content 內部
   捲動，#header/#filter-bar 因為 flex-shrink:0 永遠固定在頂端不會被捲走）─── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ─── Header（比照主 index.html，見 CLAUDE.md 第19節） ─────────────────── */
#header {
  background: linear-gradient(135deg, #14142e 0%, #1a1a38 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  flex-shrink: 0;
}
#header-top { display: flex; align-items: center; gap: 16px; padding: 12px 0 8px; }
#site-title {
  font-size: 20px; font-weight: 800; letter-spacing: 3px;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#header-stats { font-size: 11px; color: var(--text3); margin-left: auto; }
#last-updated { font-size: 11px; color: var(--text3); white-space: nowrap; cursor: default; }
#last-updated-input {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 11px; padding: 1px 4px; color-scheme: dark;
}
#nav-tabs { display: flex; gap: 2px; }
.nav-tab {
  padding: 8px 22px; font-size: 13px; font-weight: 600;
  border-radius: 6px 6px 0 0; transition: all .2s;
  background: transparent; color: var(--text3); position: relative;
}
.nav-tab.active { background: var(--accent); color: #fff; }
.nav-tab .tab-count {
  display: inline-block; background: rgba(255,255,255,.15);
  border-radius: 8px; padding: 1px 6px; font-size: 10px; margin-left: 4px;
}

/* ─── Filter bar ─────────────────────────── */
#filter-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#search-box {
  width: 220px; padding: 6px 10px; font-size: 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); outline: none;
}
#search-box:focus { border-color: var(--accent); }
#search-box::placeholder { color: var(--text3); }
.filter-sep { width: 1px; align-self: stretch; background: var(--border); flex-shrink: 0; }
.filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.filt-btn {
  padding: 5px 10px; font-size: 11px; border-radius: 6px;
  background: var(--bg3); color: var(--text3); border: 1px solid var(--border);
  white-space: nowrap;
}
.filt-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
#result-count { font-size: 11px; color: var(--text3); margin-left: auto; white-space: nowrap; }
#sort-select, #score-select {
  padding: 5px 8px; font-size: 11px; border-radius: 6px;
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  outline: none; cursor: pointer;
}
#sort-select:focus, #score-select:focus { border-color: var(--accent); }

/* ─── Cards grid ─────────────────────────── */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 60px;
  scrollbar-width: thin;
  scrollbar-color: var(--bg4) transparent;
}
#content::-webkit-scrollbar { width: 6px; }
#content::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.card {
  display: flex; flex-direction: column;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card.want-to-read { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow), 0 4px 16px rgba(245,158,11,.2); }
.card.want-to-read:hover { box-shadow: 0 0 0 1px var(--yellow), 0 6px 24px rgba(245,158,11,.35); }
@keyframes card-flash-pulse {
  0%, 100% { box-shadow: 0 0 0 2px var(--red), 0 0 14px 3px rgba(239,68,68,.55); }
  50%      { box-shadow: 0 0 0 2px var(--red), 0 0 26px 8px rgba(239,68,68,.9); }
}
.card.flash-target { animation: card-flash-pulse 1.1s ease-in-out infinite; border-color: var(--red); }
.card .cover-wrap { width: 100%; aspect-ratio: 3/4; background: var(--bg3); overflow: hidden; position: relative; }
.card .cover-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
.heart-btn {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; line-height: 1;
  background: rgba(0,0,0,.5); border: 1px solid transparent;
  cursor: pointer; color: #fff; backdrop-filter: blur(2px);
  transition: all .15s;
}
.heart-btn:hover { background: rgba(0,0,0,.7); border-color: #f59e0b55; }
.heart-btn.active { color: var(--yellow); background: rgba(0,0,0,.55); }
.card .card-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card .card-title {
  font-size: 12px; font-weight: 700; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .card-author { font-size: 10px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .card-progress { font-size: 10px; margin-top: auto; display: flex; align-items: center; gap: 5px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.status-dot.caught_up { background: var(--green); }
.status-dot.behind { background: var(--yellow); }
.status-dot.unknown { background: var(--text3); }
.card .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .card-score { font-size: 10px; color: var(--yellow); flex-shrink: 0; }
.card .card-updated { font-size: 9px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.continue-link { font-size: 10px; color: var(--accent2); }
.continue-link:hover { text-decoration: underline; }

#empty-state { display: none; text-align: center; padding: 80px 20px; color: var(--text3); }
#empty-state .es-icon { font-size: 48px; margin-bottom: 12px; }

/* ─── Detail modal ─────────────────────────── */
#detail-modal {
  display: none; position: fixed; inset: 0; background: #000a; z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
#detail-modal.open { display: flex; }
#detail-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px 24px;
}
#detail-box .dm-top { display: flex; gap: 16px; margin-bottom: 14px; }
#detail-box .dm-cover { width: 110px; height: 155px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg3); }
#detail-box .dm-title { font-size: 16px; font-weight: 700; color: var(--text); }
#detail-box .dm-author { font-size: 12px; color: var(--text3); margin-top: 3px; }
#detail-box .dm-link { font-size: 11px; color: var(--accent2); margin-top: 6px; display: inline-block; }
#detail-box .dm-link:hover { text-decoration: underline; }
#detail-box .dm-progress-line { font-size: 12px; color: var(--text2); margin-top: 8px; }
.blocked-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--red); background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.4); border-radius: 6px;
  padding: 4px 8px; margin-top: 8px;
}
.card .blocked-badge { margin-top: auto; font-size: 10px; padding: 3px 6px; }
.stale-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--blue); background: rgba(96,165,250,.12);
  border: 1px solid rgba(96,165,250,.35); border-radius: 6px;
  padding: 4px 8px; margin-top: 8px;
}
.card .stale-badge { margin-top: 4px; font-size: 9px; padding: 2px 6px; width: fit-content; }
.dm-field { margin-bottom: 12px; }
.dm-field label { display: block; font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.dm-field textarea, .dm-field input[type="text"] {
  width: 100%; box-sizing: border-box;
  background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); font-size: 12px; padding: 6px 9px; outline: none;
}
.dm-field textarea { resize: vertical; height: 70px; font-family: inherit; }
.dm-field textarea:focus, .dm-field input:focus { border-color: var(--accent); }
.dm-synopsis { font-size: 12px; color: var(--text2); line-height: 1.6; max-height: 140px; overflow-y: auto; }
.dm-score-row { display: flex; align-items: center; gap: 8px; }
.dm-score-btn {
  width: 26px; height: 26px; border-radius: 6px; font-size: 11px;
  background: var(--bg3); color: var(--text3); border: 1px solid var(--border);
}
.dm-score-btn.on { background: var(--yellow); color: #000; border-color: var(--yellow); }
#detail-close { position: absolute; top: 14px; right: 18px; font-size: 20px; color: var(--text3); background: none; }
#detail-box { position: relative; }
#detail-close:hover { color: var(--text); }

/* ─── Mobile（預設以 iPhone 14 Pro Max 的 430px 邏輯寬度為基準設計）────────── */
@media (max-width: 600px) {
  #header { padding: 0 10px; }
  #header-top { gap: 6px; flex-wrap: wrap; padding: 8px 0 6px; }
  #site-title { font-size: 15px; letter-spacing: 1px; }
  #header-stats { font-size: 9px; width: 100%; margin-left: 0; order: 10; }
  #last-updated { font-size: 9px; }
  #nav-tabs { gap: 1px; }
  .nav-tab { padding: 6px 12px; font-size: 12px; }

  #filter-bar { padding: 6px 10px; gap: 5px; }
  #search-box { width: 130px; font-size: 11px; padding: 4px 8px; }
  .filt-btn { padding: 3px 7px; font-size: 10px; }
  #result-count { width: 100%; order: 20; margin-left: 0; text-align: right; }

  #content { padding: 10px 8px 40px; }
  #cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }

  #detail-modal { padding: 10px; }
  #detail-box { padding: 16px 16px; }
  #detail-box .dm-top { gap: 12px; }
  #detail-box .dm-cover { width: 90px; height: 127px; }
}
</style>
</head>
<body>

<div id="app">

<div id="header">
  <div id="header-top">
    <span id="site-title">MY RECORDS</span>
    <span id="header-stats"></span>
    <span id="last-updated" ondblclick="startEditLastUpdated()" title="雙擊可編輯"></span>
  </div>
  <div id="nav-tabs">
    <button class="nav-tab" onclick="window.location.href='../index.html'">首頁</button>
    <button class="nav-tab" onclick="window.location.href='../動畫/anime_web.html'">
      動畫 <span class="tab-count" id="anime-count"></span>
    </button>
    <button class="nav-tab active">
      漫畫 <span class="tab-count" id="manga-count"></span>
    </button>
    <button class="nav-tab" onclick="window.location.href='../遊戲/game_web.html'">
      遊戲 <span class="tab-count" id="game-count"></span>
    </button>
  </div>
</div>

<div id="filter-bar">
  <input id="search-box" type="text" placeholder="搜尋漫畫名稱/作者…" oninput="applyFilters()">
  <div class="filter-sep"></div>
  <select id="sort-select" onchange="state.sortBy = this.value; applyFilters();" title="排序方式">
    <option value="default">🕐 觀看順序（預設）</option>
    <option value="date_desc">📅 最新更新（新→舊）</option>
    <option value="score_desc">⭐ 個人評分（高→低）</option>
    <option value="behind_desc">📚 落後進度（多→少）</option>
  </select>
  <button class="filt-btn" id="sort-reverse-btn" onclick="toggleSortReverse()" title="切換成倒序">↓ 正序</button>
  <div class="filter-sep"></div>
  <select id="score-select" onchange="state.scoreFilter = this.value; applyFilters();" title="依個人評分篩選">
    <option value="all">全部評分</option>
    <option value="10">★10</option>
    <option value="9">★9</option>
    <option value="8">★8</option>
    <option value="7">★7</option>
    <option value="6">★6</option>
    <option value="5">★5</option>
    <option value="4">★4</option>
    <option value="3">★3</option>
    <option value="2">★2</option>
    <option value="1">★1</option>
    <option value="none">未評分</option>
  </select>
  <div class="filter-sep"></div>
  <div class="filter-group" id="status-filters">
    <button class="filt-btn on" id="status-btn-caught_up" onclick="toggleShowStatus('caught_up')" title="已看到最新進度">🟢 追上進度</button>
    <button class="filt-btn on" id="status-btn-behind" onclick="toggleShowStatus('behind')" title="還有新章節沒看">🟡 落後進度</button>
    <button class="filt-btn on" id="status-btn-unknown" onclick="toggleShowStatus('unknown')" title="無法判斷進度（例如章節解析失敗，或用卷/特典等非數字單位）">⚪ 無法判斷</button>
  </div>
  <div class="filter-sep"></div>
  <button class="filt-btn" id="priority-finish-btn" onclick="togglePriorityFinish()" title="只顯示已完結、但你還沒看完的漫畫——已經完結不用等更新，適合優先補完">🎯 優先補完</button>
  <button class="filt-btn" id="link-stale-btn" onclick="toggleLinkStaleMode()" title="網頁版舊連結已失效，但確認作品本身還存在（例如在APP版找得到，或已改名/搬遷）——不是真的下架">🔗 連結待更新</button>
  <button class="filt-btn" id="want-to-read-btn" onclick="toggleWantToReadMode()" title="只顯示已按下想看愛心的漫畫">💛 想看</button>
  <div class="filter-sep" id="block-reason-sep"></div>
  <div class="filter-group" id="block-reason-filters"></div>
  <span id="result-count"></span>
</div>

<div id="content">
  <div id="cards-grid"></div>
  <div id="empty-state">
    <div class="es-icon">🔍</div>
    <div>沒有符合條件的漫畫</div>
  </div>
</div>

</div>

<div id="detail-modal">
  <div id="detail-box">
    <button id="detail-close" onclick="closeDetailModal()">✕</button>
    <div class="dm-top">
      <img class="dm-cover" id="dm-cover">
      <div>
        <div class="dm-title" id="dm-title"></div>
        <div class="dm-author" id="dm-author"></div>
        <a class="dm-link" id="dm-link" target="_blank" rel="noopener">在 manhuaren 開啟 ↗</a>
        <div class="blocked-badge" id="dm-blocked-badge" style="display:none"></div>
        <div class="stale-badge" id="dm-stale-badge" style="display:none"></div>
        <div class="dm-progress-line" id="dm-progress-line"></div>
      </div>
    </div>

    <div class="dm-field">
      <label>簡介</label>
      <div class="dm-synopsis" id="dm-synopsis"></div>
    </div>

    <div class="dm-field">
      <label>個人評分</label>
      <div class="dm-score-row" id="dm-score-row"></div>
    </div>

    <div class="dm-field">
      <label>閱讀進度（例：第32话／第3卷，留空清除紀錄）</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="dm-progress-input" placeholder="目前：讀取中…">
        <button class="filt-btn on" onclick="saveProgressFromModal()">儲存</button>
      </div>
    </div>

    <div class="dm-field">
      <label>個人心得</label>
      <textarea id="dm-comment" placeholder="寫點什麼…" onblur="saveCommentFromModal()"></textarea>
    </div>
  </div>
</div>

<script>
const data = MANGA_DATA.manga;
const state = {
  search: '',
  scoreFilter: 'all',
  showStatuses: { caught_up: true, behind: true, unknown: true },
  activeBlockReasons: new Set(), // 空集合＝正常顯示全部；選了任何一個＝只顯示對應原因被屏蔽的漫畫，方便自行複查
  sortBy: 'default', // 2026-08-16新增：'default'＝觀看順序（不排序，維持data陣列原本順序，也就是使用者最在意的「觀看先後」）
  sortReverse: false, // 倒序開關，套用在sortBy選到的任何一種排序上（包括default，可以反過來看「最早看的排最前面」）
  priorityFinishMode: false, // 「優先補完」快速篩選：只顯示已完結、但還沒看完的漫畫（不用擔心追更等待）
  linkStaleMode: false, // 「連結待更新」快速篩選：只顯示link_stale=true的漫畫（網頁版舊連結失效但確認作品仍存在，不是真的下架）
  wantToReadMode: false, // 「想看」快速篩選：只顯示want_to_read=true（已按下愛心）的漫畫
};

// 2026-08-16新增：屏蔽原因分類，跟 process_all.py 的 check_blocked() 三種樣板文字對應
// （見 CLAUDE.md/MANGA_SCRAPER_GUIDE.md），用「包含關鍵字」而不是完全比對字串，
// 因為手動查證過的幾筆在原因文字後面多了「，2026-08-16透過登入帳號確認」這種
// 後綴，完全比對會漏掉這幾筆
const BLOCK_REASON_CATEGORIES = [
  { key: 'rating',    match: r => r.includes('內容分級限制'), label: '🔞 內容分級限制' },
  { key: 'copyright', match: r => r.includes('版權方要求下架'), label: '©️ 版權下架' },
  { key: 'not_found', match: r => r.includes('頁面不存在'), label: '❓ 頁面不存在' },
];

function blockReasonKey(reason) {
  if (!reason) return null;
  const found = BLOCK_REASON_CATEGORIES.find(c => c.match(reason));
  return found ? found.key : 'other';
}

// ─── Sort（2026-08-16新增）───────────────────────────────────────────────
// 使用者最在意的是「觀看先後」，這就是 data 陣列本來的順序（來自觀看歷史頁面
// 本身的排序，見 CLAUDE.md 第19節），所以 'default' 完全不排序、直接沿用
// filterData() 篩選後的順序，不是額外算出來的排序邏輯。
function extractNum(s) {
  if (!s) return null;
  const m = String(s).match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}

// 落後幅度＝最新章節數字－已讀章節數字，只有兩者都能解析成數字時才算得出來
// （例如用卷/特典等非數字單位、或還沒讀過就算不出來，回傳null）。
// sortData()的behind_desc排序、以及統計摘要小卡的「落後總話數」都共用這個函式，
// 避免同一個算法兩邊各寫一份、以後改一邊忘記改另一邊。
function chapterGap(e) {
  const ln = extractNum(e.latest_progress), rn = extractNum(e.read_progress);
  return (ln == null || rn == null) ? null : ln - rn;
}

function sortData(list) {
  // dir 只套用在「有實際比較意義」的部分，缺值（沒有日期/評分/算不出落後幅度）
  // 永遠排在最後，不會因為倒序就跑到最前面——這是使用者體驗上比較合理的慣例，
  // 倒序反映的是「同樣有資料的項目之間，順序要不要顛倒」，不是「把不知道的
  // 也當作最大值」。
  const dir = state.sortReverse ? -1 : 1;
  if (state.sortBy === 'date_desc') {
    list.sort((a, b) => {
      if (!a.latest_update_date && !b.latest_update_date) return 0;
      if (!a.latest_update_date) return 1;
      if (!b.latest_update_date) return -1;
      return dir * b.latest_update_date.localeCompare(a.latest_update_date);
    });
  } else if (state.sortBy === 'score_desc') {
    list.sort((a, b) => {
      if (a.score == null && b.score == null) return 0;
      if (a.score == null) return 1;
      if (b.score == null) return -1;
      return dir * (b.score - a.score);
    });
  } else if (state.sortBy === 'behind_desc') {
    // 算不出來的（例如用卷/特典等非數字單位、或還沒讀過）排到最後，不強行排序
    list.sort((a, b) => {
      const ga = chapterGap(a), gb = chapterGap(b);
      if (ga == null && gb == null) return 0;
      if (ga == null) return 1;
      if (gb == null) return -1;
      return dir * (gb - ga);
    });
  } else if (state.sortReverse) {
    // 'default'（觀看順序）本身沒有比較函式，倒序就是單純把陣列整個反過來，
    // 變成「最早看的排最前面」
    list.reverse();
  }
  return list;
}

function toggleSortReverse() {
  state.sortReverse = !state.sortReverse;
  const btn = document.getElementById('sort-reverse-btn');
  btn.textContent = state.sortReverse ? '↑ 倒序' : '↓ 正序';
  btn.classList.toggle('on', state.sortReverse);
  applyFilters();
}

let _dmCurrentTitle = null;

function escHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function statusLabel(status) {
  return { caught_up: '🟢 追上進度', behind: '🟡 落後進度', unknown: '⚪ 無法判斷' }[status] || '';
}

// 把 latest_update_date（YYYY-MM-DD）換算成「幾天前」這種相對時間，方便一眼判斷新舊，
// 完整日期保留在呼叫端用 title 屬性當 hover 提示，不會遺失精確資訊
function formatRelativeDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((today - d) / 86400000);
  if (diffDays < 0) return dateStr;
  if (diffDays === 0) return '今天';
  if (diffDays === 1) return '昨天';
  if (diffDays === 2) return '前天';
  if (diffDays < 30) return `${diffDays}天前`;
  if (diffDays < 365) return `${Math.round(diffDays / 30)}個月前`;
  return `${Math.round(diffDays / 365)}年前`;
}

// ─── Filter ──────────────────────────────────────────────────────────────
function filterData() {
  const q = state.search.toLowerCase();
  // 有勾選任何「屏蔽原因」按鈕時，切換成複查模式：只顯示符合選中原因的已屏蔽
  // 漫畫，忽略評分/進度狀態篩選（被屏蔽的漫畫這兩項通常沒有意義），但搜尋框
  // 還是有效，方便在複查清單裡找特定標題
  if (state.activeBlockReasons.size > 0) {
    return data.filter(e => {
      if (!e.blocked) return false;
      if (!state.activeBlockReasons.has(blockReasonKey(e.blocked_reason))) return false;
      if (q && !e.title.toLowerCase().includes(q) && !(e.author || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }
  // 「優先補完」模式：只顯示已完結（不用等更新、沒有追更斷更風險）、
  // 但閱讀進度還落後的漫畫，忽略評分/狀態篩選（意義不大，這裡本來就只挑behind的），
  // 搜尋框仍然有效
  if (state.priorityFinishMode) {
    return data.filter(e => {
      if (e.serialization_status !== '已完结' || e.progress_status !== 'behind') return false;
      if (q && !e.title.toLowerCase().includes(q) && !(e.author || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }
  // 「連結待更新」模式：只顯示link_stale=true的漫畫（網頁版舊連結失效但已
  // 確認作品仍存在），忽略評分/狀態篩選，搜尋框仍然有效
  if (state.linkStaleMode) {
    return data.filter(e => {
      if (!e.link_stale) return false;
      if (q && !e.title.toLowerCase().includes(q) && !(e.author || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }
  // 「想看」模式：只顯示已按下愛心(want_to_read=true)的漫畫，忽略評分/狀態
  // 篩選，搜尋框仍然有效
  if (state.wantToReadMode) {
    return data.filter(e => {
      if (!e.want_to_read) return false;
      if (q && !e.title.toLowerCase().includes(q) && !(e.author || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }
  return data.filter(e => {
    if (q && !e.title.toLowerCase().includes(q) && !(e.author || '').toLowerCase().includes(q)) return false;
    if (state.scoreFilter !== 'all') {
      const scoreKey = e.score ? String(Math.round(e.score)) : 'none';
      if (scoreKey !== state.scoreFilter) return false;
    }
    if (!state.showStatuses[e.progress_status]) return false;
    return true;
  });
}

// ─── 篩選按鈕/下拉選單的即時數量（faceted count，比照 遊戲/game_web.html 的
// computeFacetCounts()/updateFilterCounts() 模式）─────────────────────────
// 每個選項顯示的數字＝套用搜尋文字＋其他群組目前的篩選條件，但不套用這個選項
// 自己所屬群組的目前選擇。「優先補完/連結待更新/想看/屏蔽原因」這幾顆是觸發
// 獨立檢視模式的按鈕（點下去會忽略評分/狀態篩選，見 filterData()），彼此也
// 互不套用，只共用搜尋文字這個共同條件，跟 renderContent() 既有的 denom
// 計算是同樣的個別條件、只是這裡要一次算出全部按鈕的數字，不是只算目前作用中
// 那一個。
function computeFacetCounts() {
  const q = state.search.toLowerCase();
  const passSearch = e => !q || e.title.toLowerCase().includes(q) || (e.author || '').toLowerCase().includes(q);

  const scoreCounts = {};
  const statusCounts = {};
  data.forEach(e => {
    if (!passSearch(e)) return;
    const scoreKey = e.score ? String(Math.round(e.score)) : 'none';
    const scoreOk = state.scoreFilter === 'all' || state.scoreFilter === scoreKey;

    // 分數桶：套用狀態篩選，不套用分數篩選本身
    if (state.showStatuses[e.progress_status]) {
      scoreCounts[scoreKey] = (scoreCounts[scoreKey] || 0) + 1;
    }
    // 狀態桶：套用分數篩選，不套用狀態篩選本身
    if (scoreOk) {
      statusCounts[e.progress_status] = (statusCounts[e.progress_status] || 0) + 1;
    }
  });

  let priorityFinishCount = 0, linkStaleCount = 0, wantToReadCount = 0;
  const blockReasonCounts = {};
  data.forEach(e => {
    if (!passSearch(e)) return;
    if (e.serialization_status === '已完结' && e.progress_status === 'behind') priorityFinishCount++;
    if (e.link_stale) linkStaleCount++;
    if (e.want_to_read) wantToReadCount++;
    if (e.blocked) {
      const key = blockReasonKey(e.blocked_reason);
      blockReasonCounts[key] = (blockReasonCounts[key] || 0) + 1;
    }
  });

  return { scoreCounts, statusCounts, priorityFinishCount, linkStaleCount, wantToReadCount, blockReasonCounts };
}

function updateFilterCounts() {
  const c = computeFacetCounts();

  const scoreAllCount = Object.values(c.scoreCounts).reduce((a, b) => a + b, 0);
  const sel = document.getElementById('score-select');
  if (sel) {
    for (const opt of sel.options) {
      const label = opt.value === 'all' ? '全部評分' : (opt.value === 'none' ? '未評分' : `★${opt.value}`);
      const count = opt.value === 'all' ? scoreAllCount : (c.scoreCounts[opt.value] || 0);
      opt.textContent = `${label} (${count})`;
    }
  }

  for (const st of ['caught_up', 'behind', 'unknown']) {
    const btn = document.getElementById(`status-btn-${st}`);
    if (btn) btn.textContent = `${statusLabel(st)} (${c.statusCounts[st] || 0})`;
  }

  const pfBtn = document.getElementById('priority-finish-btn');
  if (pfBtn) pfBtn.textContent = `🎯 優先補完 (${c.priorityFinishCount})`;
  const lsBtn = document.getElementById('link-stale-btn');
  if (lsBtn) lsBtn.textContent = `🔗 連結待更新 (${c.linkStaleCount})`;
  const wtrBtn = document.getElementById('want-to-read-btn');
  if (wtrBtn) wtrBtn.textContent = `💛 想看 (${c.wantToReadCount})`;

  BLOCK_REASON_CATEGORIES.concat([{ key: 'other', label: '❔ 其他原因' }]).forEach(cat => {
    const btn = document.getElementById(`block-reason-btn-${cat.key}`);
    if (btn) btn.textContent = `${cat.label} (${c.blockReasonCounts[cat.key] || 0})`;
  });
}

function initBlockReasonBar() {
  // 動態掃描目前資料庫裡實際有出現的屏蔽原因分類，「有幾種就顯示幾顆按鈕」，
  // 不是寫死固定顆數——之後如果 check_blocked() 又新增偵測到的分類，這裡
  // 會自動反映，不用回來改前端
  const bar = document.getElementById('block-reason-filters');
  bar.innerHTML = '';
  const counts = {};
  data.forEach(e => {
    if (!e.blocked) return;
    const key = blockReasonKey(e.blocked_reason);
    counts[key] = (counts[key] || 0) + 1;
  });
  const allCats = [...BLOCK_REASON_CATEGORIES, { key: 'other', label: '❔ 其他原因' }];
  allCats.forEach(cat => {
    const count = counts[cat.key];
    if (!count) return;
    const btn = document.createElement('button');
    btn.className = 'filt-btn';
    btn.id = `block-reason-btn-${cat.key}`;
    btn.title = `只顯示因為此原因被屏蔽的漫畫，方便自行複查是否真的被屏蔽`;
    btn.textContent = `${cat.label} (${count})`;
    btn.onclick = () => toggleBlockReason(cat.key);
    bar.appendChild(btn);
  });
  document.getElementById('block-reason-sep').style.display = bar.children.length ? '' : 'none';
}

function applyFilters() {
  state.search = document.getElementById('search-box').value;
  renderContent(sortData(filterData()));
  updateFilterCounts();
}

// ─── Render ──────────────────────────────────────────────────────────────
function renderCard(e) {
  // 最新章節（latest_progress）不管閱讀進度有沒有解析出來都要顯示——這個資訊在
  // 列表/詳情頁上本來就看得到，不需要點進任何一話就能確認，不能因為
  // read_progress_url 沒解析成功就整個藏起來，只留一個看不出進度的連結
  const progressLine = e.read_progress_url
    ? `<span>最新：${escHtml(e.latest_progress)}</span> · <a class="continue-link" href="${escHtml(e.read_progress_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">繼續閱讀 ↗</a>`
    : `<span>${e.read_progress ? escHtml(e.read_progress) : '尚未記錄'} / ${escHtml(e.latest_progress)}</span>`;
  // 被屏蔽/下架的漫畫不顯示一般的進度列（那份資料本來就抓不到、顯示出來
  // 只會是空的或誤導），改成一個醒目的紅色徽章＋簡短原因，讓使用者不用
  // 點開詳情視窗就能一眼看出這部漫畫已經讀不到了
  const progressBlock = e.blocked
    ? `<div class="blocked-badge">🚫 ${escHtml(e.blocked_reason || '已屏蔽/下架')}</div>`
    : `<div class="card-progress"><span class="status-dot ${e.progress_status}"></span>${progressLine}</div>`;
  const tq = escHtml(e.title).replace(/'/g, "\\'");
  const heartId = 'heart-' + e.title.replace(/['"<>&]/g, '_');
  const heartHtml = `<button class="heart-btn${e.want_to_read ? ' active' : ''}" id="${heartId}" onclick="toggleWantToRead(event,'${tq}')" title="想看">${e.want_to_read ? '💛' : '🤍'}</button>`;
  const updatedHtml = e.latest_update_date
    ? `<span class="card-updated" title="最新更新：${escHtml(e.latest_update_date)}">🕐 ${escHtml(formatRelativeDate(e.latest_update_date))}</span>`
    : '';
  // 跟「已下架」(blocked)不同：這是網頁版舊連結失效、但已確認作品本身還存在
  // （例如在APP版找得到，或已改名/搬遷）的獨立分類，不影響原本的進度顯示，
  // 只是額外加一個提示徽章
  const staleHtml = e.link_stale
    ? `<div class="stale-badge" title="${escHtml(e.link_stale_note || '網頁版舊連結已失效，但確認作品仍存在')}">🔗 連結待更新</div>`
    : '';
  return `<div class="card${e.want_to_read ? ' want-to-read' : ''}" data-title="${escHtml(e.title)}" onclick="openDetailModal('${tq}')">
    <div class="cover-wrap">${e.cover_path ? `<img src="${escHtml(e.cover_path)}" loading="lazy" onerror="this.style.visibility='hidden'">` : ''}${heartHtml}</div>
    <div class="card-body">
      <div class="card-title">${escHtml(e.title)}</div>
      <div class="card-author">${escHtml(e.author || '作者不詳')}</div>
      ${progressBlock}
      ${staleHtml}
      <div class="card-footer">
        <span class="card-score">${e.score ? '★'.repeat(Math.round(e.score)) + ' ' + e.score : '未評分'}</span>
        ${updatedHtml}
      </div>
    </div>
  </div>`;
}

async function toggleWantToRead(event, title) {
  event.stopPropagation();
  const e = data.find(x => x.title === title);
  if (!e) return;
  const next = !e.want_to_read;
  try {
    const res = await fetch('http://localhost:3737/api/manga/save-want-to-read', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ title, want: next })
    });
    const j = await res.json();
    if (!j.ok) { alert('儲存失敗：' + (j.error || '未知錯誤')); return; }
  } catch { alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（漫畫頁面共用同一個伺服器）。'); return; }
  e.want_to_read = next;
  const safeId = title.replace(/['"<>&]/g, '_');
  const btn = document.getElementById('heart-' + safeId);
  if (btn) { btn.textContent = next ? '💛' : '🤍'; btn.classList.toggle('active', next); }
  const card = btn?.closest('.card');
  if (card) card.classList.toggle('want-to-read', next);
}

function renderContent(filtered) {
  const grid = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  const denom = state.activeBlockReasons.size > 0
    ? data.filter(e => e.blocked).length
    : state.priorityFinishMode
      ? data.filter(e => e.serialization_status === '已完结' && e.progress_status === 'behind').length
      : state.linkStaleMode
        ? data.filter(e => e.link_stale).length
        : state.wantToReadMode
          ? data.filter(e => e.want_to_read).length
          : data.length;
  document.getElementById('result-count').textContent = `顯示 ${filtered.length} / ${denom} 部`;
  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = filtered.map(renderCard).join('');
}

function updateHeaderStats() {
  const scored = data.filter(e => e.score).length;
  const caughtUp = data.filter(e => e.progress_status === 'caught_up').length;
  document.getElementById('header-stats').textContent = `${data.length} 部漫畫 · ${scored} 部有評分 · ${caughtUp} 部已追上進度`;
  document.getElementById('manga-count').textContent = data.length;
}

// 網頁最後更新時間：使用者自己手動維護的日期（見 ../last_updated.json），
// 動畫/漫畫/遊戲三頁共用同一個檔案、顯示同一個日期
// 網頁最後更新時間：動畫/漫畫/遊戲三頁各自獨立的一個日期值（各自的 last_updated.json，
// 不是共用同一個檔案），可以直接在頁面上雙擊編輯，儲存只會動到這一頁自己的檔案，
// 跟其他任何設定/資料完全無關
let _lastUpdatedDate = null;

async function loadLastUpdated() {
  try {
    const res = await fetch('last_updated.json');
    if (!res.ok) return;
    const j = await res.json();
    _lastUpdatedDate = j.date;
    renderLastUpdated();
  } catch {
    // 檔案還沒建立時安靜略過
  }
}

function renderLastUpdated() {
  const span = document.getElementById('last-updated');
  if (!_lastUpdatedDate) { span.textContent = ''; return; }
  const [y, m, d] = _lastUpdatedDate.split('-');
  span.textContent = `最後更新：${y}年${Number(m)}月${Number(d)}日`;
}

function startEditLastUpdated() {
  const span = document.getElementById('last-updated');
  span.innerHTML = `<input type="date" id="last-updated-input" value="${_lastUpdatedDate || ''}">`;
  const input = document.getElementById('last-updated-input');
  input.focus();
  input.onblur = saveLastUpdated;
  input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
}

async function saveLastUpdated() {
  const input = document.getElementById('last-updated-input');
  const date = input.value;
  if (!date) { renderLastUpdated(); return; }
  try {
    const res = await fetch('http://localhost:3737/api/save-last-updated', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ page: 'manga', date })
    });
    const j = await res.json();
    if (j.ok) _lastUpdatedDate = j.date;
  } catch {
    alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（漫畫頁面共用同一個伺服器）。');
  }
  renderLastUpdated();
}

// ─── Detail modal ────────────────────────────────────────────────────────
function openDetailModal(title) {
  const e = data.find(x => x.title === title);
  if (!e) return;
  // 點開任何一張卡片的詳情，就清除目前正在閃爍的跳轉目標（不限定是不是剛好點到
  // 被跳轉的那張），比照動畫頁面既有的「開了詳情視窗就代表使用者已經找到它了」邏輯
  document.querySelectorAll('.card.flash-target').forEach(c => c.classList.remove('flash-target'));
  _dmCurrentTitle = title;
  document.getElementById('dm-cover').src = e.cover_path || '';
  document.getElementById('dm-title').textContent = e.title;
  document.getElementById('dm-author').textContent = e.author || '作者不詳';
  document.getElementById('dm-link').href = e.url;
  const blockedBadge = document.getElementById('dm-blocked-badge');
  if (e.blocked) {
    blockedBadge.style.display = 'inline-flex';
    blockedBadge.textContent = `🚫 ${e.blocked_reason || '已從漫畫人屏蔽/下架'}`;
  } else {
    blockedBadge.style.display = 'none';
  }
  const staleBadge = document.getElementById('dm-stale-badge');
  if (e.link_stale) {
    staleBadge.style.display = 'inline-flex';
    staleBadge.textContent = `🔗 網頁版舊連結已失效，但確認作品仍存在${e.link_stale_note ? '：' + e.link_stale_note : ''}`;
  } else {
    staleBadge.style.display = 'none';
  }
  const extraInfo = [
    e.serialization_status ? `連載狀態：${escHtml(e.serialization_status)}` : '',
    e.latest_update_date ? `最新更新：<span title="${escHtml(e.latest_update_date)}">${escHtml(formatRelativeDate(e.latest_update_date))}</span>` : '',
  ].filter(Boolean).join('　');
  document.getElementById('dm-progress-line').innerHTML =
    `${statusLabel(e.progress_status)}　最新：${escHtml(e.latest_progress)}　已讀：${e.read_progress ? escHtml(e.read_progress) : (e.read_progress_url ? `<a class="continue-link" href="${escHtml(e.read_progress_url)}" target="_blank" rel="noopener">繼續閱讀連結 ↗</a>` : '尚未記錄')}`
    + (extraInfo ? `<br>${extraInfo}` : '');
  document.getElementById('dm-synopsis').textContent = e.synopsis || '（無簡介）';
  document.getElementById('dm-comment').value = e.comment || '';
  document.getElementById('dm-progress-input').value = '';
  document.getElementById('dm-progress-input').placeholder = `目前：${e.read_progress || '尚未記錄'}`;
  renderScoreRow(e.score);
  document.getElementById('detail-modal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
  _dmCurrentTitle = null;
}

function renderScoreRow(currentScore) {
  const row = document.getElementById('dm-score-row');
  row.innerHTML = '';
  for (let s = 1; s <= 10; s++) {
    const btn = document.createElement('button');
    btn.className = 'dm-score-btn' + (currentScore === s ? ' on' : '');
    btn.textContent = s;
    btn.onclick = () => saveScoreFromModal(currentScore === s ? null : s);
    row.appendChild(btn);
  }
}

async function saveScoreFromModal(score) {
  const title = _dmCurrentTitle;
  if (!title) return;
  try {
    const res = await fetch('http://localhost:3737/api/manga/save-score', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title, score })
    });
    const j = await res.json();
    if (!j.ok) { alert('儲存失敗：' + (j.error || '未知錯誤')); return; }
    const e = data.find(x => x.title === title);
    e.score = j.score;
    renderScoreRow(e.score);
    updateHeaderStats();
    applyFilters();
  } catch { alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（漫畫頁面共用同一個伺服器）。'); }
}

async function saveCommentFromModal() {
  const title = _dmCurrentTitle;
  if (!title) return;
  const comment = document.getElementById('dm-comment').value;
  try {
    const res = await fetch('http://localhost:3737/api/manga/save-comment', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title, comment })
    });
    const j = await res.json();
    if (!j.ok) { alert('儲存失敗：' + (j.error || '未知錯誤')); return; }
    const e = data.find(x => x.title === title);
    e.comment = j.comment;
  } catch { alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（漫畫頁面共用同一個伺服器）。'); }
}

async function saveProgressFromModal() {
  const title = _dmCurrentTitle;
  if (!title) return;
  const progress = document.getElementById('dm-progress-input').value.trim();
  try {
    const res = await fetch('http://localhost:3737/api/manga/save-progress', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title, progress })
    });
    const j = await res.json();
    if (!j.ok) { alert('儲存失敗：' + (j.error || '未知錯誤')); return; }
    // 進度更新可能連帶改變 progress_status，直接重讀該筆最新狀態最保險
    const res2 = await fetch('data.js?v=' + Date.now());
    const text = await res2.text();
    const freshAll = JSON.parse(text.slice('const MANGA_DATA = '.length, -1));
    const fresh = freshAll.manga.find(x => x.title === title);
    if (fresh) {
      const idx = data.findIndex(x => x.title === title);
      data[idx] = fresh;
      openDetailModal(title);
      updateHeaderStats();
      applyFilters();
    }
  } catch { alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（漫畫頁面共用同一個伺服器）。'); }
}

document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeDetailModal();
});

updateHeaderStats();
loadAnimeCount();
loadGameCount();
loadLastUpdated();
initBlockReasonBar();

// 從首頁儀表板點進來的深連結（?jump=標題）：捲到該卡片並閃爍。跟動畫頁不同，
// 這裡不需要一個能撐過整頁重繪的 module-level 旗標——jump只會發生在剛載入頁面
// 那一刻，之後不會有任何自動重繪把這個 class 洗掉，直接找DOM節點加class即可，
// 不用像動畫頁的 _flashTitle 那樣費心處理 TDZ／要在 renderCard() 樣板裡烘進判斷式
// 自訂的「追蹤式」捲動動畫，寫法跟 動畫/anime_web.html 的 _chaseScrollTo 完全一致
// （每幀重新計算目標卡片座標、指數趨近，確保真的收斂在卡片可視範圍內才算完成，
// 不是元素存在於DOM就好），這頁雖然沒有 content-visibility 的問題，但同樣要讓
// 使用者「看得到」捲動過程，而且要有明確的「動畫真正停下來」時機點可以掛
// onSettled callback，原生 scrollIntoView({behavior:'smooth'}) 沒有可靠的
// 完成事件可以拿來確定「現在真的停了」
function _chaseScrollTo(container, card, onSettled) {
  const EPSILON = 1, EASE = 0.15, MAX_FRAMES = 420;
  let frame = 0, done = false;
  function finish(finalTop) {
    if (done) return;
    done = true;
    if (finalTop != null) container.scrollTop = finalTop;
    if (onSettled) onSettled();
  }
  function computeTarget() {
    const cRect = container.getBoundingClientRect();
    const eRect = card.getBoundingClientRect();
    const relTop = eRect.top - cRect.top + container.scrollTop;
    const raw = relTop - (cRect.height - eRect.height) / 2;
    const maxScroll = container.scrollHeight - container.clientHeight;
    return Math.max(0, Math.min(raw, maxScroll));
  }
  function step() {
    if (done) return;
    frame++;
    const target = computeTarget();
    const cur = container.scrollTop;
    const delta = target - cur;
    if (Math.abs(delta) < EPSILON || frame > MAX_FRAMES) {
      finish(target);
      return;
    }
    container.scrollTop = cur + delta * EASE;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // 安全網：分頁不在前景時rAF可能被嚴重節流，用setTimeout保底，見
  // 動畫/anime_web.html 的 _chaseScrollTo 同一處註解
  setTimeout(() => finish(computeTarget()), 3000);
}

function _scrollAndFlashTitle(title, onSettled) {
  const card = document.querySelector(`.card[data-title="${CSS.escape(title)}"]`);
  if (!card) { if (onSettled) onSettled(); return; }
  card.classList.add('flash-target');
  _chaseScrollTo(document.getElementById('content'), card, onSettled);
}
(function handleJumpParam() {
  const jumpTitle = new URLSearchParams(location.search).get('jump');
  if (jumpTitle && data.some(e => e.title === jumpTitle)) {
    // 動畫真正停下來（onSettled）才開始算1秒，不是捲動指令一發出就倒數——避免
    // 長距離捲動還在滑，詳情視窗就提早跳出來蓋住畫面
    _scrollAndFlashTitle(jumpTitle, () => {
      setTimeout(() => openDetailModal(jumpTitle), 1000);
    });
  }
})();
