<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的遊戲紀錄</title>
<script src="data.js?v=1787034868"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0d0d1a;
  --bg2:      #13132a;
  --bg3:      #1a1a35;
  --bg4:      #22223f;
  --border:   #2a2a50;
  --accent:   #7c3aed;
  --accent2:  #a78bfa;
  --accent3:  #c4b5fd;
  --green:    #10b981;
  --yellow:   #f59e0b;
  --red:      #ef4444;
  --blue:     #60a5fa;
  --text:     #e0e0f0;
  --text2:    #9090b0;
  --text3:    #555570;
  --radius:   8px;
}
html { font-size: 14px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; font-family: inherit; }

/* ─── Layout（比照主 anime_web.html：#app 撐滿 100vh，只有 #content 內部
   捲動，#header/#filter-bar 因為 flex-shrink:0 永遠固定在頂端不會被捲走）─── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ─── Header（比照 anime_web.html／comic_web.html，見 CLAUDE.md 第19/20節） ── */
#header {
  background: linear-gradient(135deg, #14142e 0%, #1a1a38 100%);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  flex-shrink: 0;
}
#header-top { display: flex; align-items: center; gap: 16px; padding: 12px 0 8px; }
#site-title {
  font-size: 20px; font-weight: 800; letter-spacing: 3px;
  background: linear-gradient(135deg, #a78bfa, #60a5fa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#header-stats { font-size: 11px; color: var(--text3); margin-left: auto; }
#last-updated { font-size: 11px; color: var(--text3); white-space: nowrap; cursor: default; }
#last-updated-input {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 11px; padding: 1px 4px; color-scheme: dark;
}
#mock-banner {
  font-size: 11px; color: var(--yellow); background: rgba(245,158,11,.12);
  border: 1px solid rgba(245,158,11,.35); border-radius: 6px; padding: 3px 10px; margin-left: 10px;
}
#nav-tabs { display: flex; gap: 2px; }
.nav-tab {
  padding: 8px 22px; font-size: 13px; font-weight: 600;
  border-radius: 6px 6px 0 0; transition: all .2s;
  background: transparent; color: var(--text3); position: relative;
}
.nav-tab.active { background: var(--accent); color: #fff; }
.nav-tab .tab-count {
  display: inline-block; background: rgba(255,255,255,.15);
  border-radius: 8px; padding: 1px 6px; font-size: 10px; margin-left: 4px;
}

/* ─── Filter bar ─────────────────────────── */
#filter-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#search-box {
  width: 220px; padding: 6px 10px; font-size: 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); outline: none;
}
#search-box:focus { border-color: var(--accent); }
#search-box::placeholder { color: var(--text3); }
.filter-sep { width: 1px; align-self: stretch; background: var(--border); flex-shrink: 0; }
.filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.filt-btn {
  padding: 5px 10px; font-size: 11px; border-radius: 6px;
  background: var(--bg3); color: var(--text3); border: 1px solid var(--border);
  white-space: nowrap;
}
.filt-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
#result-count { font-size: 11px; color: var(--text3); margin-left: auto; white-space: nowrap; }
#sort-select, #score-select {
  padding: 5px 8px; font-size: 11px; border-radius: 6px;
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  outline: none; cursor: pointer;
}
#sort-select:focus, #score-select:focus { border-color: var(--accent); }

/* ─── Cards grid ─────────────────────────── */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 60px;
  scrollbar-width: thin;
  scrollbar-color: var(--bg4) transparent;
}
#content::-webkit-scrollbar { width: 6px; }
#content::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.card {
  display: flex; flex-direction: column;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
@keyframes card-flash-pulse {
  0%, 100% { box-shadow: 0 0 0 2px var(--red), 0 0 14px 3px rgba(239,68,68,.55); }
  50%      { box-shadow: 0 0 0 2px var(--red), 0 0 26px 8px rgba(239,68,68,.9); }
}
.card.flash-target { animation: card-flash-pulse 1.1s ease-in-out infinite; border-color: var(--red); }
.card .cover-wrap { width: 100%; aspect-ratio: 2/3; background: var(--bg3); overflow: hidden; position: relative; }
.card .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .cover-placeholder {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800; color: var(--text3); background: var(--bg3);
}
.card .card-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.card .card-title {
  font-size: 12px; font-weight: 700; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .card-playtime { font-size: 10px; color: var(--text2); }
.card .card-recent { font-size: 10px; color: var(--accent2); }
.card .card-achievements { font-size: 10px; color: var(--yellow); }
.card .card-bottom-row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.status-badge { font-size: 10px; padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
.status-badge.want_to_play { color: var(--text3); background: var(--bg4); }
.status-badge.playing      { color: var(--blue);  background: rgba(96,165,250,.12); }
.status-badge.completed    { color: var(--green); background: rgba(16,185,129,.12); }
.status-badge.dropped      { color: var(--red);   background: rgba(239,68,68,.12); }
.card .card-score { font-size: 10px; color: var(--yellow); white-space: nowrap; }

#empty-state { display: none; text-align: center; padding: 80px 20px; color: var(--text3); }
#empty-state .es-icon { font-size: 48px; margin-bottom: 12px; }

/* ─── Detail modal ─────────────────────────── */
#detail-modal {
  display: none; position: fixed; inset: 0; background: #000a; z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
#detail-modal.open { display: flex; }
#detail-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px 24px;
  position: relative;
}
#detail-box .dm-top { display: flex; gap: 16px; margin-bottom: 14px; }
#detail-box .dm-cover { width: 120px; height: 180px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--bg3); }
#detail-box .dm-title { font-size: 16px; font-weight: 700; color: var(--text); }
#detail-box .dm-link { font-size: 11px; color: var(--accent2); margin-top: 6px; display: inline-block; }
#detail-box .dm-link:hover { text-decoration: underline; }
#detail-box .dm-playtime-line { font-size: 12px; color: var(--text2); margin-top: 8px; line-height: 1.7; }
.dm-achv-wrap { margin-top: 10px; }
.dm-achv-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.dm-achv-bar { height: 6px; border-radius: 3px; background: var(--bg4); overflow: hidden; }
.dm-achv-fill { height: 100%; background: var(--yellow); border-radius: 3px; }
.dm-field { margin-bottom: 12px; }
.dm-field label { display: block; font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.dm-field textarea, .dm-field input[type="text"] {
  width: 100%; box-sizing: border-box;
  background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); font-size: 12px; padding: 6px 9px; outline: none;
}
.dm-field textarea { resize: vertical; height: 70px; font-family: inherit; }
.dm-field textarea:focus, .dm-field input:focus { border-color: var(--accent); }
.dm-score-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dm-score-btn {
  width: 26px; height: 26px; border-radius: 6px; font-size: 11px;
  background: var(--bg3); color: var(--text3); border: 1px solid var(--border);
}
.dm-score-btn.on { background: var(--yellow); color: #000; border-color: var(--yellow); }
.dm-status-row { display: flex; gap: 6px; flex-wrap: wrap; }
.dm-status-btn {
  padding: 5px 12px; font-size: 11px; border-radius: 6px;
  background: var(--bg3); color: var(--text3); border: 1px solid var(--border);
}
.dm-status-btn.on.want_to_play { background: var(--text3); color: #fff; border-color: var(--text3); }
.dm-status-btn.on.playing      { background: var(--blue);  color: #000; border-color: var(--blue); }
.dm-status-btn.on.completed    { background: var(--green); color: #000; border-color: var(--green); }
.dm-status-btn.on.dropped      { background: var(--red);   color: #fff; border-color: var(--red); }
.dm-tags-box { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.dm-tag-chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
  background: var(--bg4); color: var(--text2); border-radius: 12px; padding: 3px 6px 3px 10px;
}
.dm-tag-chip button { background: none; color: var(--text3); font-size: 13px; line-height: 1; padding: 0 2px; }
.dm-tag-chip button:hover { color: var(--red); }
#detail-close { position: absolute; top: 14px; right: 18px; font-size: 20px; color: var(--text3); background: none; }
#detail-close:hover { color: var(--text); }

/* ─── Mobile（預設以 iPhone 14 Pro Max 的 430px 邏輯寬度為基準設計）────────── */
@media (max-width: 600px) {
  #header { padding: 0 10px; }
  #header-top { gap: 6px; flex-wrap: wrap; padding: 8px 0 6px; }
  #site-title { font-size: 15px; letter-spacing: 1px; }
  #header-stats { font-size: 9px; width: 100%; margin-left: 0; order: 10; }
  #last-updated { font-size: 9px; }
  #mock-banner { font-size: 9px; margin-left: 0; }
  #nav-tabs { gap: 1px; }
  .nav-tab { padding: 6px 12px; font-size: 12px; }

  #filter-bar { padding: 6px 10px; gap: 5px; }
  #search-box { width: 130px; font-size: 11px; padding: 4px 8px; }
  .filt-btn { padding: 3px 7px; font-size: 10px; }
  #result-count { width: 100%; order: 20; margin-left: 0; text-align: right; }

  #content { padding: 10px 8px 40px; }
  #cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }

  #detail-modal { padding: 10px; }
  #detail-box { padding: 16px 16px; }
  #detail-box .dm-top { gap: 12px; }
  #detail-box .dm-cover { width: 90px; height: 135px; }
}
</style>
</head>
<body>

<div id="app">

<div id="header">
  <div id="header-top">
    <span id="site-title">MY RECORDS</span>
    <span id="header-stats"></span>
    <span id="last-updated" ondblclick="startEditLastUpdated()" title="雙擊可編輯"></span>
    <span id="mock-banner" style="display:none">⚠ 目前是模擬資料，尚未同步真實 Steam 資料（見 steam_config.json）</span>
  </div>
  <div id="nav-tabs">
    <button class="nav-tab" onclick="window.location.href='../index.html'">首頁</button>
    <button class="nav-tab" onclick="window.location.href='../動畫/anime_web.html'">
      動畫 <span class="tab-count" id="anime-count"></span>
    </button>
    <button class="nav-tab" onclick="window.location.href='../漫畫/comic_web.html'">
      漫畫 <span class="tab-count" id="manga-count"></span>
    </button>
    <button class="nav-tab active">
      遊戲 <span class="tab-count" id="game-count"></span>
    </button>
  </div>
</div>

<div id="filter-bar">
  <input id="search-box" type="text" placeholder="搜尋遊戲名稱…" oninput="applyFilters()">
  <div class="filter-sep"></div>
  <select id="sort-select" onchange="state.sortBy = this.value; applyFilters();" title="排序方式">
    <option value="default">⏱ 遊玩時數（多→少，預設）</option>
    <option value="achievement_desc">🏆 成就完成度（高→低）</option>
    <option value="score_desc">⭐ 個人評分（高→低）</option>
    <option value="recent_desc">🕐 最近遊玩（新→舊）</option>
  </select>
  <button class="filt-btn" id="sort-reverse-btn" onclick="toggleSortReverse()" title="切換成倒序">↓ 正序</button>
  <div class="filter-sep"></div>
  <select id="score-select" onchange="state.scoreFilter = this.value; applyFilters();" title="依個人評分篩選">
    <option value="all">全部評分</option>
    <option value="10">★10</option>
    <option value="9">★9</option>
    <option value="8">★8</option>
    <option value="7">★7</option>
    <option value="6">★6</option>
    <option value="5">★5</option>
    <option value="4">★4</option>
    <option value="3">★3</option>
    <option value="2">★2</option>
    <option value="1">★1</option>
    <option value="none">未評分</option>
  </select>
  <div class="filter-sep"></div>
  <div class="filter-group" id="status-filters">
    <button class="filt-btn on" id="status-btn-want_to_play" onclick="toggleShowStatus('want_to_play')" title="遊玩時數為0">⚪ 想玩</button>
    <button class="filt-btn on" id="status-btn-playing" onclick="toggleShowStatus('playing')" title="有遊玩時數，尚未手動標記通關/棄坑">🔵 遊玩中</button>
    <button class="filt-btn on" id="status-btn-completed" onclick="toggleShowStatus('completed')" title="手動標記為已通關">🟢 已通關</button>
    <button class="filt-btn on" id="status-btn-dropped" onclick="toggleShowStatus('dropped')" title="手動標記為棄坑">🔴 棄坑</button>
  </div>
  <div class="filter-sep"></div>
  <button class="filt-btn" id="achievement-filter-btn" onclick="toggleAchievementFilter()" title="只顯示有成就系統（achievements_total有值）的遊戲">🏆 只看有成就</button>
  <span id="result-count"></span>
</div>

<div id="content">
  <div id="cards-grid"></div>
  <div id="empty-state">
    <div class="es-icon">🎮</div>
    <div>沒有符合條件的遊戲</div>
  </div>
</div>

</div>

<div id="detail-modal">
  <div id="detail-box">
    <button id="detail-close" onclick="closeDetailModal()">✕</button>
    <div class="dm-top">
      <img class="dm-cover" id="dm-cover" onerror="_dmCoverFallback(this)">
      <div>
        <div class="dm-title" id="dm-title"></div>
        <a class="dm-link" id="dm-link" target="_blank" rel="noopener">在 Steam 商店開啟 ↗</a>
        <div class="dm-playtime-line" id="dm-playtime-line"></div>
        <div class="dm-achv-wrap" id="dm-achv-wrap" style="display:none">
          <div class="dm-achv-label" id="dm-achv-label"></div>
          <div class="dm-achv-bar"><div class="dm-achv-fill" id="dm-achv-fill"></div></div>
        </div>
      </div>
    </div>

    <div class="dm-field">
      <label>狀態</label>
      <div class="dm-status-row" id="dm-status-row"></div>
    </div>

    <div class="dm-field">
      <label>個人評分</label>
      <div class="dm-score-row" id="dm-score-row"></div>
    </div>

    <div class="dm-field">
      <label>標籤（輸入後按 Enter 新增）</label>
      <div class="dm-tags-box" id="dm-tags-box"></div>
      <input type="text" id="dm-tag-input" placeholder="輸入標籤，按 Enter 新增…">
    </div>

    <div class="dm-field">
      <label>個人心得</label>
      <textarea id="dm-comment" placeholder="寫點什麼…" onblur="saveCommentFromModal()"></textarea>
    </div>
  </div>
</div>

<script>
const data = GAME_DATA.games;
const state = {
  search: '',
  sortBy: 'default',
  sortReverse: false,
  onlyAchievements: false,
  scoreFilter: 'all',
  showStatuses: { want_to_play: true, playing: true, completed: true, dropped: true },
};
let _dmCurrentAppid = null;

function escHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const STATUS_LABEL = { want_to_play: '⚪ 想玩', playing: '🔵 遊玩中', completed: '🟢 已通關', dropped: '🔴 棄坑' };
const SCORE_OPTION_LABEL = { all: '全部評分', 10: '★10', 9: '★9', 8: '★8', 7: '★7', 6: '★6', 5: '★5', 4: '★4', 3: '★3', 2: '★2', 1: '★1', none: '未評分' };

function fmtHours(minutes) {
  const h = minutes / 60;
  return (h >= 10 ? Math.round(h) : Math.round(h * 10) / 10) + ' 小時';
}

function fmtLastPlayed(rtime) {
  if (!rtime) return '尚未遊玩過';
  const days = Math.floor((Date.now() / 1000 - rtime) / 86400);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 30) return `${days} 天前`;
  if (days < 365) return `${Math.floor(days / 30)} 個月前`;
  return `${Math.floor(days / 365)} 年前`;
}

// 封面圖直接用 Steam CDN 依 appid 組網址，不需要額外的 API 呼叫；
// 三層 fallback：直式大圖 → 橫式header圖 → 顯示遊戲名稱首字的預留位置
function coverUrl(appid, stage) {
  if (stage === 0) return `https://cdn.akamai.steamstatic.com/steam/apps/${appid}/library_600x900.jpg`;
  if (stage === 1) return `https://cdn.akamai.steamstatic.com/steam/apps/${appid}/header.jpg`;
  return null;
}

function _imgFallback(img, appid) {
  const stage = Number(img.dataset.stage || 0) + 1;
  const next = coverUrl(appid, stage);
  if (next) {
    img.dataset.stage = stage;
    img.src = next;
  } else {
    const ph = document.createElement('div');
    ph.className = 'cover-placeholder';
    ph.textContent = (img.alt || '?')[0];
    img.replaceWith(ph);
  }
}

function _dmCoverFallback(img) {
  const stage = Number(img.dataset.stage || 0) + 1;
  const e = data.find(x => x.appid === _dmCurrentAppid);
  const next = coverUrl(_dmCurrentAppid, stage);
  if (next) { img.dataset.stage = stage; img.src = next; }
  else { img.style.visibility = 'hidden'; }
}

// ─── Filter ──────────────────────────────────────────────────────────────
function filterData() {
  const q = state.search.toLowerCase();
  return data.filter(e => {
    if (q && !e.name.toLowerCase().includes(q)) return false;
    if (state.scoreFilter !== 'all') {
      const scoreKey = e.score ? String(Math.round(e.score)) : 'none';
      if (scoreKey !== state.scoreFilter) return false;
    }
    if (!state.showStatuses[e.status]) return false;
    if (state.onlyAchievements && !e.achievements_total) return false;
    return true;
  });
}

// ─── 篩選按鈕/下拉選單的即時數量（faceted count）─────────────────────────
// 每個選項顯示的數字＝「搜尋文字 + 其他群組目前的篩選條件」都套用、但**不**套用
// 這個選項自己所屬群組的目前選擇，算出「切成這個選項」會有多少筆。這樣不管
// 目前選到哪個選項，數字都代表「切成這個選項會有多少筆」，隨著使用者調整搜尋/
// 其他篩選而即時更新，不是開機當下算一次就不動的靜態總數。
function computeFacetCounts() {
  const q = state.search.toLowerCase();
  const passSearch = e => !q || e.name.toLowerCase().includes(q);

  const scoreCounts = {};
  const statusCounts = {};
  let achievementCount = 0;
  data.forEach(e => {
    if (!passSearch(e)) return;
    const scoreKey = e.score ? String(Math.round(e.score)) : 'none';

    // 分數桶：套用狀態+成就篩選，不套用分數篩選本身
    if (state.showStatuses[e.status] && (!state.onlyAchievements || e.achievements_total)) {
      scoreCounts[scoreKey] = (scoreCounts[scoreKey] || 0) + 1;
    }
    // 狀態桶：套用分數+成就篩選，不套用狀態篩選本身
    if ((state.scoreFilter === 'all' || state.scoreFilter === scoreKey) && (!state.onlyAchievements || e.achievements_total)) {
      statusCounts[e.status] = (statusCounts[e.status] || 0) + 1;
    }
    // 成就篩選：套用分數+狀態篩選，不套用成就篩選本身，只算「有成就系統」的筆數
    if ((state.scoreFilter === 'all' || state.scoreFilter === scoreKey) && state.showStatuses[e.status] && e.achievements_total) {
      achievementCount++;
    }
  });
  return { scoreCounts, statusCounts, achievementCount };
}

function updateFilterCounts() {
  const { scoreCounts, statusCounts, achievementCount } = computeFacetCounts();
  const scoreAllCount = Object.values(scoreCounts).reduce((a, b) => a + b, 0);
  const sel = document.getElementById('score-select');
  if (sel) {
    for (const opt of sel.options) {
      const label = SCORE_OPTION_LABEL[opt.value];
      const count = opt.value === 'all' ? scoreAllCount : (scoreCounts[opt.value] || 0);
      opt.textContent = `${label} (${count})`;
    }
  }

  for (const st of ['want_to_play', 'playing', 'completed', 'dropped']) {
    const btn = document.getElementById(`status-btn-${st}`);
    if (btn) btn.textContent = `${STATUS_LABEL[st]} (${statusCounts[st] || 0})`;
  }

  const achvBtn = document.getElementById('achievement-filter-btn');
  if (achvBtn) achvBtn.textContent = `🏆 只看有成就 (${achievementCount})`;
}

// ─── Sort（比照 漫畫/comic_web.html 的 sortData() 模式）───────────────────
// 'default' 維持改版前的既有行為（遊玩時數多→少），不是「不排序」；其餘排序
// 缺值一律排到最後、不受倒序影響（dir只套用在雙方都有值、真的能比較的情況）。
function sortData(list) {
  const dir = state.sortReverse ? -1 : 1;
  if (state.sortBy === 'achievement_desc') {
    list.sort((a, b) => {
      const pa = a.achievements_total ? a.achievements_unlocked / a.achievements_total : null;
      const pb = b.achievements_total ? b.achievements_unlocked / b.achievements_total : null;
      if (pa == null && pb == null) return 0;
      if (pa == null) return 1;
      if (pb == null) return -1;
      return dir * (pb - pa);
    });
  } else if (state.sortBy === 'score_desc') {
    list.sort((a, b) => {
      if (a.score == null && b.score == null) return 0;
      if (a.score == null) return 1;
      if (b.score == null) return -1;
      return dir * (b.score - a.score);
    });
  } else if (state.sortBy === 'recent_desc') {
    list.sort((a, b) => {
      if (!a.rtime_last_played && !b.rtime_last_played) return 0;
      if (!a.rtime_last_played) return 1;
      if (!b.rtime_last_played) return -1;
      return dir * (b.rtime_last_played - a.rtime_last_played);
    });
  } else {
    // 'default'：遊玩時數多→少，跟改版前的舊行為完全一致
    list.sort((a, b) => dir * (b.playtime_forever - a.playtime_forever));
  }
  return list;
}

function toggleSortReverse() {
  state.sortReverse = !state.sortReverse;
  const btn = document.getElementById('sort-reverse-btn');
  btn.textContent = state.sortReverse ? '↑ 倒序' : '↓ 正序';
  btn.classList.toggle('on', state.sortReverse);
  applyFilters();
}

function toggleAchievementFilter() {
  state.onlyAchievements = !state.onlyAchievements;
  document.getElementById('achievement-filter-btn').classList.toggle('on', state.onlyAchievements);
  applyFilters();
}

function toggleShowStatus(status) {
  state.showStatuses[status] = !state.showStatuses[status];
  document.getElementById(`status-btn-${status}`).classList.toggle('on', state.showStatuses[status]);
  applyFilters();
}

function applyFilters() {
  state.search = document.getElementById('search-box').value;
  renderContent(sortData(filterData()));
  updateFilterCounts();
}

// ─── Render ──────────────────────────────────────────────────────────────
function renderCard(e) {
  const recentHtml = e.playtime_2weeks
    ? `<div class="card-recent">🔥 近兩週 ${fmtHours(e.playtime_2weeks)}</div>` : '';
  // 成就進度：只有 achievements_total 有值（這款遊戲真的有成就系統、且查詢成功過）
  // 才顯示，null代表「沒有成就系統」或「還沒執行過fetch_achievements.py查詢」，
  // 兩種情況都不該顯示誤導的「0/0」
  const achvHtml = e.achievements_total
    ? `<div class="card-achievements">🏆 ${e.achievements_unlocked}/${e.achievements_total}（${Math.round(e.achievements_unlocked / e.achievements_total * 100)}%）</div>` : '';
  return `<div class="card" data-appid="${e.appid}" onclick="openDetailModal(${e.appid})">
    <div class="cover-wrap">
      <img src="${coverUrl(e.appid, 0)}" alt="${escHtml(e.name)}" loading="lazy" onerror="_imgFallback(this, ${e.appid})">
    </div>
    <div class="card-body">
      <div class="card-title">${escHtml(e.name)}</div>
      <div class="card-playtime">${e.playtime_forever ? '已玩 ' + fmtHours(e.playtime_forever) : '尚未遊玩'}</div>
      ${recentHtml}
      ${achvHtml}
      <div class="card-bottom-row">
        <span class="status-badge ${e.status}">${STATUS_LABEL[e.status]}</span>
        <span class="card-score">${e.score ? '★' + e.score : ''}</span>
      </div>
    </div>
  </div>`;
}

function renderContent(filtered) {
  const grid = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  document.getElementById('result-count').textContent = `顯示 ${filtered.length} / ${data.length} 款`;
  if (!filtered.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = filtered.map(renderCard).join('');
}

function updateHeaderStats() {
  const scored = data.filter(e => e.score).length;
  const completed = data.filter(e => e.status === 'completed').length;
  const totalHours = Math.round(data.reduce((sum, e) => sum + e.playtime_forever, 0) / 60);
  document.getElementById('header-stats').textContent =
    `${data.length} 款遊戲 · ${scored} 款有評分 · ${completed} 款已通關 · 累計 ${totalHours} 小時`;
  document.getElementById('game-count').textContent = data.length;
  if (GAME_DATA.is_mock_data) document.getElementById('mock-banner').style.display = 'inline-block';
}

// 動畫/漫畫 nav-tab 的數量徽章：只讀對方資料夾產生的一個小數字檔，見 CLAUDE.md 第19/20節，
// 不載入/解析對方完整的 data.js，維持三個頁面互不需要懂對方資料結構的原則
async function loadAnimeCount() {
  try {
    const res = await fetch('../動畫/anime_count.json');
    if (!res.ok) return;
    const j = await res.json();
    document.getElementById('anime-count').textContent = j.count;
  } catch { /* 動畫資料還沒建立時安靜略過 */ }
}
async function loadMangaCount() {
  try {
    const res = await fetch('../漫畫/count.json');
    if (!res.ok) return;
    const j = await res.json();
    document.getElementById('manga-count').textContent = j.count;
  } catch { /* 漫畫資料還沒建立時安靜略過 */ }
}

// 網頁最後更新時間：使用者自己手動維護的日期（見 ../last_updated.json），
// 動畫/漫畫/遊戲三頁共用同一個檔案、顯示同一個日期
// 網頁最後更新時間：動畫/漫畫/遊戲三頁各自獨立的一個日期值（各自的 last_updated.json，
// 不是共用同一個檔案），可以直接在頁面上雙擊編輯，儲存只會動到這一頁自己的檔案，
// 跟其他任何設定/資料完全無關
let _lastUpdatedDate = null;

async function loadLastUpdated() {
  try {
    const res = await fetch('last_updated.json');
    if (!res.ok) return;
    const j = await res.json();
    _lastUpdatedDate = j.date;
    renderLastUpdated();
  } catch { /* 檔案還沒建立時安靜略過 */ }
}

function renderLastUpdated() {
  const span = document.getElementById('last-updated');
  if (!_lastUpdatedDate) { span.textContent = ''; return; }
  const [y, m, d] = _lastUpdatedDate.split('-');
  span.textContent = `最後更新：${y}年${Number(m)}月${Number(d)}日`;
}

function startEditLastUpdated() {
  const span = document.getElementById('last-updated');
  span.innerHTML = `<input type="date" id="last-updated-input" value="${_lastUpdatedDate || ''}">`;
  const input = document.getElementById('last-updated-input');
  input.focus();
  input.onblur = saveLastUpdated;
  input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
}

async function saveLastUpdated() {
  const input = document.getElementById('last-updated-input');
  const date = input.value;
  if (!date) { renderLastUpdated(); return; }
  try {
    const res = await fetch('http://localhost:3737/api/save-last-updated', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ page: 'game', date })
    });
    const j = await res.json();
    if (j.ok) _lastUpdatedDate = j.date;
  } catch {
    alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（遊戲頁面共用同一個伺服器）。');
  }
  renderLastUpdated();
}

// ─── Detail modal ────────────────────────────────────────────────────────
function openDetailModal(appid) {
  const e = data.find(x => x.appid === appid);
  if (!e) return;
  document.querySelectorAll('.card.flash-target').forEach(c => c.classList.remove('flash-target'));
  _dmCurrentAppid = appid;
  const cover = document.getElementById('dm-cover');
  cover.dataset.stage = 0;
  cover.style.visibility = 'visible';
  cover.src = coverUrl(appid, 0);
  cover.alt = e.name;
  document.getElementById('dm-title').textContent = e.name;
  document.getElementById('dm-link').href = `https://store.steampowered.com/app/${appid}/`;
  document.getElementById('dm-playtime-line').innerHTML =
    `總遊玩時數：${fmtHours(e.playtime_forever)}<br>` +
    (e.playtime_2weeks ? `近兩週：${fmtHours(e.playtime_2weeks)}<br>` : '') +
    `最後遊玩：${fmtLastPlayed(e.rtime_last_played)}`;
  const achvWrap = document.getElementById('dm-achv-wrap');
  if (e.achievements_total) {
    const pct = Math.round(e.achievements_unlocked / e.achievements_total * 100);
    document.getElementById('dm-achv-label').textContent = `🏆 成就進度：${e.achievements_unlocked}/${e.achievements_total}（${pct}%）`;
    document.getElementById('dm-achv-fill').style.width = pct + '%';
    achvWrap.style.display = 'block';
  } else {
    achvWrap.style.display = 'none';
  }
  document.getElementById('dm-comment').value = e.comment || '';
  renderScoreRow(e.score);
  renderStatusRow(e.status);
  renderTagsBox(e.tags || []);
  document.getElementById('dm-tag-input').value = '';
  document.getElementById('detail-modal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
  _dmCurrentAppid = null;
}

function renderScoreRow(currentScore) {
  const row = document.getElementById('dm-score-row');
  row.innerHTML = '';
  for (let s = 1; s <= 10; s++) {
    const btn = document.createElement('button');
    btn.className = 'dm-score-btn' + (currentScore === s ? ' on' : '');
    btn.textContent = s;
    btn.onclick = () => saveScoreFromModal(currentScore === s ? null : s);
    row.appendChild(btn);
  }
}

function renderStatusRow(currentStatus) {
  const row = document.getElementById('dm-status-row');
  row.innerHTML = '';
  for (const st of ['want_to_play', 'playing', 'completed', 'dropped']) {
    const btn = document.createElement('button');
    btn.className = 'dm-status-btn ' + st + (currentStatus === st ? ' on' : '');
    btn.textContent = STATUS_LABEL[st];
    btn.onclick = () => saveStatusFromModal(st);
    row.appendChild(btn);
  }
}

function renderTagsBox(tags) {
  const box = document.getElementById('dm-tags-box');
  box.innerHTML = tags.map(t => `<span class="dm-tag-chip">${escHtml(t)}<button onclick="removeTagFromModal('${escHtml(t).replace(/'/g,"\\'")}')">✕</button></span>`).join('');
}

async function _postGame(endpoint, body) {
  try {
    const res = await fetch(`http://localhost:3737/api/game/${endpoint}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const j = await res.json();
    if (!j.ok) { alert('儲存失敗：' + (j.error || '未知錯誤')); return null; }
    return j;
  } catch {
    alert('無法連線到伺服器，請確認 動畫/server.py 已啟動（遊戲頁面共用同一個伺服器）。');
    return null;
  }
}

async function saveScoreFromModal(score) {
  const appid = _dmCurrentAppid;
  if (!appid) return;
  const j = await _postGame('save-score', { appid, score });
  if (!j) return;
  const e = data.find(x => x.appid === appid);
  e.score = j.score;
  renderScoreRow(e.score);
  updateHeaderStats();
  applyFilters();
}

async function saveStatusFromModal(status) {
  const appid = _dmCurrentAppid;
  if (!appid) return;
  const e = data.find(x => x.appid === appid);
  const newStatus = e.status === status ? null : status;
  const j = await _postGame('save-status', { appid, status: newStatus });
  if (!j) return;
  // status 是 null 的話代表清除手動標記，畫面上要顯示回自動推算的狀態，
  // 跟 build.py 的 compute_status 邏輯保持一致（手動棄坑/已通關才需要覆寫）
  e.status = newStatus || (e.playtime_forever ? 'playing' : 'want_to_play');
  renderStatusRow(j.status);
  updateHeaderStats();
  applyFilters();
}

async function saveCommentFromModal() {
  const appid = _dmCurrentAppid;
  if (!appid) return;
  const comment = document.getElementById('dm-comment').value;
  const j = await _postGame('save-comment', { appid, comment });
  if (!j) return;
  const e = data.find(x => x.appid === appid);
  e.comment = j.comment;
}

async function _saveTagsNow() {
  const appid = _dmCurrentAppid;
  const e = data.find(x => x.appid === appid);
  const j = await _postGame('save-tags', { appid, tags: e.tags });
  if (j) renderTagsBox(j.tags);
}

document.getElementById('dm-tag-input').addEventListener('keydown', function(ev) {
  if (ev.key !== 'Enter') return;
  const val = this.value.trim();
  if (!val || !_dmCurrentAppid) return;
  const e = data.find(x => x.appid === _dmCurrentAppid);
  e.tags = e.tags || [];
  if (!e.tags.includes(val)) e.tags.push(val);
  this.value = '';
  _saveTagsNow();
});

function removeTagFromModal(tag) {
  const e = data.find(x => x.appid === _dmCurrentAppid);
  e.tags = (e.tags || []).filter(t => t !== tag);
  _saveTagsNow();
}

document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeDetailModal();
});

// 從首頁儀表板點進來的深連結（?jump=appid）：捲到該卡片並閃爍，寫法比照
// 漫畫頁的 _scrollAndFlashTitle，只是用appid（數字）取代title當識別key
// 自訂的「追蹤式」捲動動畫，寫法跟 動畫/anime_web.html 的 _chaseScrollTo 完全一致，
// 見該處註解說明；這頁跟漫畫頁一樣沒有 content-visibility 的問題，但同樣需要
// 「看得到」的捲動過程＋可靠的「動畫真正停下來」時機點
function _chaseScrollTo(container, card, onSettled) {
  const EPSILON = 1, EASE = 0.15, MAX_FRAMES = 420;
  let frame = 0, done = false;
  function finish(finalTop) {
    if (done) return;
    done = true;
    if (finalTop != null) container.scrollTop = finalTop;
    if (onSettled) onSettled();
  }
  function computeTarget() {
    const cRect = container.getBoundingClientRect();
    const eRect = card.getBoundingClientRect();
    const relTop = eRect.top - cRect.top + container.scrollTop;
    const raw = relTop - (cRect.height - eRect.height) / 2;
    const maxScroll = container.scrollHeight - container.clientHeight;
    return Math.max(0, Math.min(raw, maxScroll));
  }
  function step() {
    if (done) return;
    frame++;
    const target = computeTarget();
    const cur = container.scrollTop;
    const delta = target - cur;
    if (Math.abs(delta) < EPSILON || frame > MAX_FRAMES) {
      finish(target);
      return;
    }
    container.scrollTop = cur + delta * EASE;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // 安全網：分頁不在前景時rAF可能被嚴重節流，用setTimeout保底，見
  // 動畫/anime_web.html 的 _chaseScrollTo 同一處註解
  setTimeout(() => finish(computeTarget()), 3000);
}

function _scrollAndFlashAppid(appid, onSettled) {
  const card = document.querySelector(`.card[data-appid="${appid}"]`);
  if (!card) { if (onSettled) onSettled(); return; }
  card.classList.add('flash-target');
  _chaseScrollTo(document.getElementById('content'), card, onSettled);
}

// ─── Init ────────────────────────────────────────────────────────────────
updateHeaderStats();
loadAnimeCount();
loadMangaCount();
loadLastUpdated();
applyFilters();

(function handleJumpParam() {
  const jumpAppid = new URLSearchParams(location.search).get('jump');
  if (!jumpAppid) return;
  const target = data.find(e => String(e.appid) === jumpAppid);
  if (target) {
    // 動畫真正停下來（onSettled）才開始算1秒，不是捲動指令一發出就倒數，
    // 跟動畫/漫畫頁 handleJumpParam() 是同一套設計
    _scrollAndFlashAppid(target.appid, () => {
      setTimeout(() => openDetailModal(target.appid), 1000);
    });
  }
})();
